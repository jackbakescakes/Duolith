<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Duolith</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d17; overflow: hidden; }
  canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; cursor: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
  // ---------- Config ----------
  const VIEW_W = 480, VIEW_H = 270;          // low-res internal canvas, scaled up for pixel-art look

  // Camera zoom per phase. Night is pulled right back on the giant tower; day is pushed right in on the tiny mage,
  // so the mage on screen is about the size the tower was at night (the scale reveal the game is built around).
  const NIGHT_ZOOM = 1, DAY_ZOOM = 2;
  const ZOOM_EASE = 2.6;                     // how fast the camera zooms between phases (higher = faster)

  // Night: the tower
  const TOWER_SPEED = 38;                    // px/s, slow and heavy
  const TOWER_ACCEL = 5;                     // smoothing: higher = snappier
  const TOWER_W = 40, TOWER_H = 56;          // hitbox; the body sprite is 64x88 (plus legs), so the hitbox is forgiving
  const BODY_W = 64, BODY_H = 72;            // body sprite size
  const LEG_VIS = 16;                        // how much of each root-leg shows below the body
  const FIRE_INTERVAL = 2.0;                 // seconds between ballista shots
  const ARROW_SPEED = 220;
  const ARROW_LIFE = 1.4;
  const ARROW_DAMAGE = 1;
  const ZOMBIE_SIZE = 12;                    // hitbox; the zombie sprite is 20x20
  const ZOMBIE_SPEED_MIN = 14, ZOMBIE_SPEED_MAX = 22;
  const ZOMBIE_HP = 2;
  const SPAWN_MARGIN = 32;                  // spawn just outside the screen
  const XP_SIZE = 4;
  const MAX_ZOMBIES = 400;

  // Day: the blacksmith (world units; at DAY_ZOOM each world pixel is 2 screen pixels)
  const MAGE_SPEED = 46;
  const MAGE_ACCEL = 18;
  const MAGE_R = 3;                          // body radius for bumping into trees, rocks and the tower
  const REACH = 14;                          // how far from the mage a tree or rock can be hit
  const CLICK_SLOP = 10;                     // how far the click can be from a tree or rock and still pick it
  const SWING_CD = 0.32;                     // seconds between axe/pick swings (hold the mouse to keep swinging)
  const XP_MAGNET = 12, XP_PICKUP = 4;       // XP drifts to the mage inside MAGNET and is collected inside PICKUP
  const TREE_HP = 3, ROCK_HP = 4;
  const TREES = 24, ROCKS = 16;              // resource nodes kept around the tower each dawn
  const NODE_RING_MIN = 56, NODE_RING_MAX = 230;
  // Resource nodes. drops: [resource, min, max]. 'from' is how far from the tower they start to appear.
  const NODE_TYPES = {
    tree:    { hp: 3, r: 3, spr: 'tree', sprs: ['tree', 'tree', 'tree_pine', 'tree_pine', 'tree_birch', 'tree_autumn'], gap: 26, sway: 1.7, want: 20, from: 56,  cy: 12, h: 36, chip: '#8a5a32', drops: [['wood', 2, 3]] },
    rock:    { hp: 4, r: 4, spr: 'rock', sprs: ['rock', 'rock', 'rock_moss', 'rock_tall', 'rock_pair'], gap: 20, want: 12, from: 56,  cy: 5,  h: 14, chip: '#9aa0aa', drops: [['stone', 2, 3]] },
    copper:  { hp: 5, r: 4, spr: 'ore_copper',   want: 5,  from: 80,  cy: 4,  h: 11, chip: '#e08a4a', drops: [['copper', 2, 3], ['stone', 0, 1]] },
    iron:    { hp: 7, r: 4, spr: 'ore_iron',     want: 3,  from: 110, cy: 4,  h: 11, chip: '#b8d0ff', drops: [['iron', 1, 2], ['stone', 1, 1]], rare: 'IRON!' },
    crystal: { hp: 8, r: 4, spr: 'crystal_node', want: 2,  from: 140, cy: 6,  h: 14, chip: '#6fe8ff', drops: [['crystal', 1, 2]], rare: 'CRYSTAL!' },
  };
  const RES_COLOR = { wood: '#d9a066', stone: '#c4c9d4', copper: '#e08a4a', iron: '#b8d0ff', crystal: '#6fe8ff', xp: '#3fb6ff' };
  const COPPER_CHANCE = 0.18, IRON_CHANCE = 0.05;   // per rock broken
  const DAY_LENGTH = 90, NIGHT_LENGTH = 70;          // seconds

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  canvas.width = VIEW_W; canvas.height = VIEW_H;
  ctx.imageSmoothingEnabled = false;

  // ---------- Assets ----------
  // All art lives in ./assets as image files and is loaded by URL at runtime.
  // Nothing is embedded in this file. Paths are relative to ASSET_DIR and must match tools/sprites.json.
  // A sprite that is missing or fails to load simply keeps its coloured-rectangle placeholder.
  const ASSET_DIR = 'assets/';
  const ASSET_FILES = {
    tower:  'tower/tower.png',
    zombie: 'enemies/zombie.png',
    xp:     'pickups/xp.png',
    arrow:  'projectiles/arrow.png',
    ground: 'tiles/ground.png',
    leg:    'tower/leg.png',
    w_ballista: 'weapons/ballista.png',
    w_cannon:   'weapons/cannon.png',
    w_coil:     'weapons/coil.png',
    w_frost:    'weapons/frost.png',
    w_catapult: 'weapons/catapult.png',
    w_orb:      'weapons/orb.png',
    p_fire:  'projectiles/fireball.png',
    p_bolt:  'projectiles/bolt.png',
    p_shard: 'projectiles/iceshard.png',
    p_rock:  'projectiles/boulder.png',
    p_orb:   'projectiles/arcaneorb.png',
    smith:  'smith/smith.png',          // strip of 3 frames, 26x26 each: idle, walk A, walk B
    tree_pine: 'resources/tree_pine.png', tree_birch: 'resources/tree_birch.png', tree_autumn: 'resources/tree_autumn.png',
    rock_moss: 'resources/rock_moss.png', rock_pair: 'resources/rock_pair.png', rock_tall: 'resources/rock_tall.png',
    grass_s: 'resources/grass_s.png', grass_tall: 'resources/grass_tall.png', grass_daisy: 'resources/grass_daisy.png',
    grass_violet: 'resources/grass_violet.png', grass_mush: 'resources/grass_mush.png', fern: 'resources/fern.png',
    grass: 'tiles/grass.png',
    ore_copper: 'resources/ore_copper.png', ore_iron: 'resources/ore_iron.png', crystal_node: 'resources/crystal_node.png',
    ic_wood: 'pickups/ic_wood.png', ic_stone: 'pickups/ic_stone.png', ic_copper: 'pickups/ic_copper.png',
    ic_iron: 'pickups/ic_iron.png', ic_crystal: 'pickups/ic_crystal.png',
    tree:   'resources/tree.png',
    rock:   'resources/rock.png',
  };
  const sprites = {};   // key -> loaded Image (absent until loaded)
  const flashes = {};   // key -> tinted copy used for hit flashes

  function tint(img, color) {
    const c = document.createElement('canvas');
    c.width = img.width; c.height = img.height;
    const g = c.getContext('2d');
    g.drawImage(img, 0, 0);
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
    return c;
  }

  function loadAssets() {
    const keysToLoad = Object.keys(ASSET_FILES), missing = [];
    let pending = keysToLoad.length;
    const settle = () => {
      if (--pending === 0 && missing.length) console.info('[assets] using placeholders for: ' + missing.join(', '));
    };
    for (const key of keysToLoad) {
      const img = new Image();
      img.onload = () => {
        sprites[key] = img;
        if (key === 'zombie') flashes.zombie = tint(img, '#ffffff');
        if (key === 'tower') flashes.tower = tint(img, '#ffd0d0');
        if (key === 'tree') flashes.tree = tint(img, '#fff4d0');
        if (key === 'rock') flashes.rock = tint(img, '#ffffff');
        if (/^(tree|rock)_/.test(key)) flashes[key] = tint(img, '#fff8e0');
        if (key === 'ore_copper' || key === 'ore_iron' || key === 'crystal_node') flashes[key] = tint(img, '#ffffff');
        settle();
      };
      img.onerror = () => { missing.push(ASSET_FILES[key]); settle(); };
      img.src = ASSET_DIR + ASSET_FILES[key];
    }
  }
  loadAssets();   // game starts immediately; sprites swap in as they arrive

  // ---------- Input ----------
  const keys = {};
  const mouse = { sx: VIEW_W / 2, sy: VIEW_H / 2, wx: 0, wy: 0, down: false };
  addEventListener('keydown', e => {
    keys[e.code] = true;
    if (e.code === 'KeyR') reset();
    if (e.code === 'KeyN' && !e.repeat) togglePhase();   // skip ahead: sleep now / dawn now / skip the cutscene
    if (e.code === 'Space') { e.preventDefault(); if (phase === 'bed' && !e.repeat) skipBed(); }
    if (e.code === 'Tab') e.preventDefault();
    if ((e.code === 'KeyE' || e.code === 'Tab' || e.code === 'Escape') && !e.repeat && phase === 'day') {
      if (menu) menu = false; else if (e.code !== 'Escape') openWorkshop();
    }
    if (/^Digit[1-6]$/.test(e.code) && !e.repeat) {     // switch owned weapons on and off
      const w = weapons[+e.code.slice(5) - 1];
      if (w && w.owned) { w.on = !w.on; w.timer = Math.min(w.timer, 0.3); }
    }
  });
  addEventListener('keyup', e => { keys[e.code] = false; });
  addEventListener('blur', () => { for (const k in keys) keys[k] = false; mouse.down = false; });
  canvas.addEventListener('mousemove', e => {
    const r = canvas.getBoundingClientRect();
    mouse.sx = (e.clientX - r.left) / r.width * VIEW_W;
    mouse.sy = (e.clientY - r.top) / r.height * VIEW_H;
  });
  canvas.addEventListener('mousedown', e => {
    if (e.button !== 0) return;
    if (menu && phase === 'day') { menuClick(); return; }
    if (phase === 'day' && clickedTower()) { openWorkshop(); return; }
    mouse.down = true;
  });
  addEventListener('mouseup', e => { if (e.button === 0) mouse.down = false; });

  // ---------- State ----------
  let phase, zoom, zoomTarget, dayLight, nightNo;
  let loot, hudBump, dayGain, banner, hitstop = 0, lastDayPos, dusk, toWorkshop, walkT, dayTime, bed, dawnT, menu, menuOk = 0, menuDeny = 0, up;
  let tower, mage, zombies, shots, zaps, rings, weapons, xpDrops, particles, nodes, floaters, res;
  let orbAng, spawnTimer, time, kills, shake, gameOver;
  let camX, camY, camTx = 0, camTy = 0;      // camTx/camTy: last screen translation, for mouse and HUD maths

  function reset() {
    phase = 'day'; zoom = zoomTarget = DAY_ZOOM; dayLight = 1; nightNo = 1; dayTime = DAY_LENGTH;
    bed = null; dawnT = 0; menu = false; dawnFlags = {}; dusk = false; toWorkshop = false; walkT = 0;
    up = { hp: 0, spd: 0, armor: 0, regen: 0, swing: 0, mspd: 0, magnet: 0, yield: 0, reach: 0, power: 0 };
    loot = []; hudBump = {}; dayGain = { wood: 0, stone: 0, copper: 0, iron: 0, crystal: 0, xp: 0 }; lastDayPos = { x: 0, y: 0 };
    banner = { text: 'DAY 1', sub: 'GATHER, UPGRADE, THEN SLEEP', t: 0, dur: 3 };
    tower = { x: 0, y: 0, vx: 0, vy: 0, hp: 100, maxHp: 100, hitFlash: 0, step: 0, facing: 1,
              amp: 0, sink: 1, thump: 0, bodyX: 0, bodyY: 0, dirx: 1, diry: 0, legS: [0, 0, 0, 0],
              bury: [1, 1, 1, 1], legPull: [0, 0, 0, 0], pose: { x: 0, y: 0 }, scratch: 0, scratchWob: 0, scripted: false,
              eye: { open: 0, look: 0, mouth: 0, blink: 0, nextBlink: 3 } };
    mage = { x: 0, y: 0, vx: 0, vy: 0, aim: 0, flip: false, step: 0, swing: 0, swingCd: 0, swingDir: 0, z: 0 };
    zombies = []; shots = []; zaps = []; rings = []; xpDrops = []; particles = []; nodes = []; floaters = [];
    weapons = WEAPON_DEFS.map((d, i) => ({ ...d, owned: d.id === 'ballista', on: d.id === 'ballista', rapid: 0, heavy: 0, timer: 0.6 + i * 0.25, kick: 0, face: 1 }));
    orbAng = 0;
    res = { wood: 0, stone: 0, copper: 0, iron: 0, crystal: 0, xp: 0 };
    spawnTimer = 0; time = 0; kills = 0; shake = 0; gameOver = false;
    topUpNodes();
    mage.x = tower.x - 14; mage.y = towerBaseY() + 16;
    camX = mage.x; camY = mage.y - 6;
  }

  // ---------- Helpers ----------
  const rand = (a, b) => a + Math.random() * (b - a);
  const dist2 = (ax, ay, bx, by) => (ax - bx) ** 2 + (ay - by) ** 2;
  const towerBaseY = () => tower.y + TOWER_H / 2;

  function burst(x, y, color, n, spd) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * 6.28, s = rand(spd * 0.3, spd);
      particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.2, 0.5), max: 0.5, color });
    }
  }

  function floatText(x, y, text, color) { floaters.push({ x, y, text, color, life: 1.1 }); }

  // ---------- Phases ----------
  // The loop: day (gather, upgrade) -> bed cutscene -> night (the tower walks and fights) -> dawn -> day ...
  const easeIO = t => t * t * (3 - 2 * t);
  const seg = (t, a, b) => Math.max(0, Math.min(1, (t - a) / (b - a)));
  const lerp = (a, b, t) => a + (b - a) * t;
  let dawnFlags = {};

  function nearTower() { return Math.hypot(mage.x - tower.x, mage.y - towerBaseY()) < 52; }

  // TEMPORARY test shortcut (N): skip ahead to the next phase.
  function togglePhase() {
    if (gameOver) return;
    if (phase === 'day') { if (menu || dusk) goToBed(); else beginDusk(); } else if (phase === 'night') startDawn(); else if (phase === 'bed') skipBed();
  }

  // Each morning the smith wakes at a different spot around wherever the tower ended up, and the trees and rocks are
  // laid out fresh there (later: pick them by biome from where the tower has travelled).
  function pickSpawn() {
    const a = Math.random() * 6.2832, cx = tower.x, cy = towerBaseY() - 4;
    return { x: cx + Math.cos(a) * 34, y: cy + Math.sin(a) * 34 };
  }

  function startDay() {            // morning: the smith is up and the tower is rooted
    phase = 'day'; zoomTarget = DAY_ZOOM; dayTime = DAY_LENGTH; dusk = false; toWorkshop = false; mage.z = 0;
    const walked = Math.round(Math.hypot(tower.x - lastDayPos.x, tower.y - lastDayPos.y) / 10); lastDayPos = { x: tower.x, y: tower.y };
    dayGain = { wood: 0, stone: 0, copper: 0, iron: 0, crystal: 0, xp: 0 };
    banner = { text: 'DAY ' + nightNo, sub: nightNo > 1 ? 'THE TOWER WALKED ' + walked + 'm' : 'GATHER, UPGRADE, THEN SLEEP', t: 0, dur: 3 };
    tower.scripted = false; tower.vx = tower.vy = 0; tower.bury.fill(1); tower.legPull = [0, 0, 0, 0];
    tower.hp = tower.maxHp;
    mage.vx = mage.vy = 0; mage.swing = 0;
    nodes = []; topUpNodes();
  }

  // End of the day (timer, or N): the smith walks to the tower and the workshop opens for one last round of upgrades.
  function beginDusk() {
    if (phase !== 'day' || dusk) return;
    dusk = true; toWorkshop = true; walkT = 0; menu = false;
    floatText(mage.x, mage.y - 16, 'NIGHTFALL', '#ffd890');
  }

  // Bedtime: the mage walks to the foot of the tower and lies down; see updateBed for the wake-up.
  function goToBed() {
    if (phase !== 'day') return;
    menu = false; phase = 'bed'; mage.vx = mage.vy = 0;
    for (const l of loot) { res[l.type]++; dayGain[l.type]++; } loot = [];     // anything still lying about goes in the pack
    bed = { t: -1, flags: {}, zzz: 0, zw: 0.3 };
    floatText(mage.x, mage.y - 20, '*yawn*', '#cfd6ff');
  }
  const BED_END = 12.4;
  function skipBed() { if (phase === 'bed' && bed.t < BED_END) { if (bed.t < 0) bed.t = 0; bed.t = BED_END - 0.001; } }

  function poseBody(dt) {          // body offsets while a cutscene is driving the tower
    tower.thump *= Math.exp(-9 * dt);
    const avg = (tower.bury[0] + tower.bury[1] + tower.bury[2] + tower.bury[3]) / 4;
    tower.bodyY = tower.pose.y + tower.thump * 1.6 + avg * 4;
    tower.bodyX = tower.pose.x;
  }

  function updateBed(dt) {
    const bx = tower.x, by = towerBaseY() + 6;                         // the foot of the tower; he hops up and inside
    if (bed.t < 0) {
      if (bed.jump === undefined) {                                    // walk to the foot of the tower
        const dx = bx - mage.x, dy = by - mage.y, d = Math.hypot(dx, dy);
        if (d < 1.5) { bed.jump = 0; bed.jx = mage.x; mage.vx = mage.vy = 0; }
        else {
          mage.vx = dx / d * 40; mage.vy = dy / d * 40;                // sleepy shuffle
          mage.x += mage.vx * dt; mage.y += mage.vy * dt; mage.flip = dx < 0; mage.step += 40 * dt * 0.35;
          bed.zw -= dt; if (bed.zw <= 0) { bed.zw = 0.55; floatText(mage.x + 2, mage.y - 22, 'z', '#cfd6ff'); }
        }
      } else {                                                         // hop up into the tower
        bed.jump += dt / 0.5;
        const u = Math.min(1, bed.jump);
        mage.x = bed.jx + (bx - bed.jx) * u; mage.y = by + (towerBaseY() - 8 - by) * u; mage.z = Math.sin(u * Math.PI) * 12;
        if (u >= 1) { bed.t = 0; mage.z = 0; tower.scripted = true; burst(tower.x, towerBaseY() - 4, '#6b5a48', 6, 25); }
      }
      camX = mage.x; camY = mage.y - 6;
      updateGait(dt, true);
      return;
    }
    bed.t += dt;
    const t = bed.t, e = tower.eye, P = tower.pose;

    // Camera: from the sleeping mage, up the tower, and out until the tower is about the size the mage was
    const pz = easeIO(seg(t, 0.8, 4.0));
    zoom = Math.exp(lerp(Math.log(DAY_ZOOM), Math.log(NIGHT_ZOOM), pz)); zoomTarget = NIGHT_ZOOM;
    camX = lerp(mage.x, tower.x, pz); camY = lerp(mage.y - 6, tower.y - 8, pz);

    bed.zzz -= dt;                                                     // sleepy Zs
    if (t < 4.2 && bed.zzz <= 0) { bed.zzz = 0.7; { const o = bodyOrigin(); floatText(o.x + 37, o.y + 32, 'z', '#cfd6ff'); } }

    // 4.0 eyes open, 4.7 yawn, 5.9 stretch, 7.1 legs out, 9.7 look around, 10.6 scratch nose, 11.7 push off
    const open = easeIO(seg(t, 4.0, 4.7));
    const ym = Math.sin(seg(t, 4.7, 5.9) * Math.PI);
    e.mouth = ym; e.open = open * (1 - 0.65 * ym);
    const sm = seg(t, 5.9, 7.1), pm = seg(t, 11.7, 12.3);
    P.x = Math.sin(sm * 6.2832) * 3.4 + pm * 2.5 * (tower.dirx || 1);
    P.y = -2.2 * ym - 3 * Math.sin(sm * Math.PI) + (t > 11.7 ? -1 * Math.sin(pm * Math.PI) : 0);
    if (sm > 0 && sm < 0.05 && !bed.flags.cr) { bed.flags.cr = 1; shake = Math.max(shake, 1); }

    for (let i = 0; i < 4; i++) {                                      // pull the legs out of the ground, one at a time
      const st = 7.1 + i * 0.55, u = seg(t, st, st + 0.9);
      tower.bury[i] = 1 - easeIO(u);
      tower.legPull[i] = Math.sin(u * Math.PI) * 9;
      const p = legPose(i);
      if (u > 0 && !bed.flags['up' + i]) { bed.flags['up' + i] = 1; burst(p.x, p.y, '#5a4636', 12, 50); shake = Math.max(shake, 1.6); }
      if (u >= 1 && !bed.flags['dn' + i]) { bed.flags['dn' + i] = 1; burst(p.x, p.y, '#6b5a48', 9, 38); tower.thump = 1; shake = Math.max(shake, 2.4); }
    }

    e.look = Math.sin(seg(t, 9.7, 10.6) * 6.2832);                    // glance around
    tower.scratch = Math.sin(seg(t, 10.6, 11.7) * Math.PI); tower.scratchWob = t * 24;   // scratch the nose with a leg
    poseBody(dt);
    if (t >= BED_END) startNight();
  }

  function startNight() {          // the tower is up: hand over control
    phase = 'night'; zoom = zoomTarget = NIGHT_ZOOM; time = 0; spawnTimer = 0;
    banner = { text: 'NIGHT ' + nightNo, sub: 'SURVIVE UNTIL DAWN', t: 0, dur: 2.6 };
    weapons.forEach((w, i) => { w.timer = 0.6 + i * 0.25; });
    tower.scripted = false; tower.hp = tower.maxHp; tower.bury.fill(0); tower.legPull = [0, 0, 0, 0];
    tower.scratch = 0; tower.pose.x = tower.pose.y = 0;
    tower.eye.open = 1; tower.eye.mouth = 0; tower.eye.look = 0;
    camX = tower.x; camY = tower.y; bed = null; mage.swing = 0;
    shake = Math.max(shake, 1);
  }

  // First light: the dead crumble, the tower plants its legs one by one and nods off, the mage wakes.
  function startDawn() {
    if (phase !== 'night') return;
    phase = 'dawn'; dawnT = 0; dawnFlags = {};
    for (const z of zombies) burst(z.x, z.y, '#6f6a80', 4, 30);
    zombies = []; shots = []; zaps = []; rings = [];
    tower.scripted = true; tower.legPull = [0, 0, 0, 0];
    const sp = pickSpawn(); mage.x = sp.x; mage.y = sp.y; mage.vx = mage.vy = 0;
    floatText(tower.x, tower.y - 50, 'DAWN', '#ffe9a0');
  }

  function updateDawn(dt) {
    dawnT += dt;
    tower.vx *= Math.exp(-5 * dt); tower.vy *= Math.exp(-5 * dt);
    tower.x += tower.vx * dt; tower.y += tower.vy * dt;
    for (let i = 0; i < 4; i++) {
      const st = 0.9 + i * 0.4, u = seg(dawnT, st, st + 0.5);
      tower.bury[i] = easeIO(u);
      if (u >= 1 && !dawnFlags['p' + i]) { dawnFlags['p' + i] = 1; const p = legPose(i); burst(p.x, p.y, '#6b5a48', 8, 34); tower.thump = 1; shake = Math.max(shake, 1.8); }
    }
    updateGait(dt, false);
    const e = tower.eye; e.open = 1 - easeIO(seg(dawnT, 2.0, 2.8));
    if (dawnT > 2.2) zoomTarget = DAY_ZOOM;
    if (dawnT >= 3.6) { nightNo++; startDay(); }
  }

  // ---------- Upgrades ----------
  // By day the mage spends gathered wood, stone and copper on the tower (new weapons, and two ways to improve each:
  // RAPID fires faster but each hit is weaker, HEAVY hits harder but fires slower) and on the tower's body. XP the
  // tower earned at night is spent on the smith himself.
  const WEAPON_COST = {
    ballista: null,
    cannon: { wood: 8, stone: 6, iron: 2 }, coil: { stone: 6, copper: 4, crystal: 1 }, frost: { wood: 6, copper: 3, crystal: 2 },
    catapult: { wood: 12, stone: 10, iron: 3 }, orb: { copper: 8, crystal: 3 },
  };
  const TRACK_MAX = 3;
  const tierCost = n => n === 0 ? { wood: 4, stone: 3 } : n === 1 ? { wood: 6, stone: 5, copper: 3 } : { wood: 8, iron: 3, crystal: 2 };
  const XP_COST = [3, 5, 8, 12, 17];
  const wInterval = w => w.interval * Math.pow(0.72, w.rapid) * Math.pow(1.1, w.heavy);
  const wDmg = w => Math.pow(0.9, w.rapid) * Math.pow(1.45, w.heavy);
  const orbCount = () => ORB_COUNT + weapons[5].rapid;
  const towerMaxHp = () => 100 + 25 * up.hp;
  const towerSpeed = () => TOWER_SPEED * (1 + 0.08 * up.spd);
  const mageSpeed = () => MAGE_SPEED * (1 + 0.1 * up.mspd);
  const swingCd = () => SWING_CD * Math.pow(0.88, up.swing);
  const xpMagnet = () => XP_MAGNET * (1 + 0.3 * up.magnet);
  const reachBonus = () => up.reach * 2;

  const RES_LETTER = { wood: 'W', stone: 'S', copper: 'C', iron: 'I', crystal: 'Cr', xp: 'xp' };
  const costText = c => Object.entries(c).map(([k, v]) => v + RES_LETTER[k]).join(' ');
  const canPay = c => Object.entries(c).every(([k, v]) => (res[k] || 0) >= v);
  const pay = c => { for (const [k, v] of Object.entries(c)) res[k] -= v; };

  // Every button in the workshop, with its rectangle in screen space (used for both drawing and clicking).
  function menuItems() {
    const items = [], RH = 16, X0 = 14, Y0 = 38, XR = 262;
    weapons.forEach((w, i) => {
      const y = Y0 + i * RH;
      if (!w.owned) {
        const c = WEAPON_COST[w.id];
        items.push({ x: X0 + 70, y, w: 168, h: RH - 3, text: 'BUY  ' + costText(c), cost: c, act: () => { w.owned = true; w.on = true; w.timer = 0.3; } });
        return;
      }
      [['rapid', 0], ['heavy', 85]].forEach(([track, dx]) => {
        const n = w[track], label = track === 'rapid' ? 'RAPID' : 'HEAVY';
        if (n >= TRACK_MAX) items.push({ x: X0 + 70 + dx, y, w: 83, h: RH - 3, text: label + ' MAX', maxed: true });
        else { const c = tierCost(n); items.push({ x: X0 + 70 + dx, y, w: 83, h: RH - 3, text: label[0] + (n + 1) + ' ' + costText(c), cost: c, act: () => { w[track]++; } }); }
      });
    });
    const rows = [
      ['TOWER HP', 'hp', 5, n => ({ wood: 5 + 4 * n, stone: 4 + 3 * n }), () => { up.hp++; tower.maxHp = towerMaxHp(); tower.hp = tower.maxHp; }],
      ['TOWER SPEED', 'spd', 4, n => ({ wood: 4 + 3 * n, copper: 2 + 2 * n }), () => { up.spd++; }],
      ['TOWER ARMOR', 'armor', 4, n => ({ iron: 2 + 2 * n, stone: 4 + 2 * n }), () => { up.armor++; }],
      ['TOWER REGEN', 'regen', 3, n => ({ wood: 4 + 3 * n, crystal: 1 + n }), () => { up.regen++; }],
      ['SMITH SWING', 'swing', 5, n => ({ xp: XP_COST[n] }), () => { up.swing++; }],
      ['SMITH SPEED', 'mspd', 5, n => ({ xp: XP_COST[n] }), () => { up.mspd++; }],
      ['XP MAGNET', 'magnet', 5, n => ({ xp: XP_COST[n] }), () => { up.magnet++; }],
      ['LUCKY HANDS', 'yield', 5, n => ({ xp: XP_COST[n] }), () => { up.yield++; }],
      ['LONG REACH', 'reach', 4, n => ({ xp: XP_COST[n] }), () => { up.reach++; }],
      ['HEAVY HAMMER', 'power', 4, n => ({ xp: XP_COST[n] }), () => { up.power++; }],
    ];
    rows.forEach(([name, key, max, costFn, act], i) => {
      const n = up[key], y = Y0 + i * RH;
      if (n >= max) items.push({ x: XR, y, w: 196, h: RH - 3, text: name + ' ' + n + ' MAX', maxed: true });
      else { const c = costFn(n); items.push({ x: XR, y, w: 196, h: RH - 3, text: name + ' ' + n + '  ' + costText(c), cost: c, act }); }
    });
    items.push({ x: XR, y: Y0 + 10 * RH + 6, w: 196, h: 22, text: 'SLEEP: END THE DAY', big: true, act: goToBed });
    return items;
  }

  function menuClick() {
    for (const it of menuItems()) {
      if (mouse.sx < it.x || mouse.sx > it.x + it.w || mouse.sy < it.y || mouse.sy > it.y + it.h) continue;
      if (it.maxed || !it.act) return;
      if (it.cost && !canPay(it.cost)) { menuDeny = 0.25; return; }
      if (it.cost) pay(it.cost);
      it.act(); menuOk = 0.25;
      return;
    }
  }

  function drawMenu(label) {
    ctx.fillStyle = 'rgba(8,10,20,0.92)'; ctx.fillRect(8, 8, 464, 232);
    ctx.fillStyle = '#3a4268'; ctx.fillRect(8, 8, 464, 1); ctx.fillRect(8, 239, 464, 1); ctx.fillRect(8, 8, 1, 232); ctx.fillRect(471, 8, 1, 232);
    label('TOWER WORKSHOP', 14, 14, '#ffe9a0');
    label('E / ESC to close', 350, 14, '#8a90b0');
    label('ARMS  R=faster,weaker  H=harder,slower', 14, 26, '#aab2d8');
    label('TOWER (materials)  /  SMITH (xp)', 262, 26, '#aab2d8');
    const items = menuItems();
    weapons.forEach((w, i) => {
      const y = 38 + i * 16;
      ctx.globalAlpha = w.owned ? 1 : 0.45;
      const img = sprites[w.spr];
      if (img) ctx.drawImage(img, 0, 0, 20, 20, 14, y - 2, 16, 16); else { ctx.fillStyle = w.color; ctx.fillRect(16, y, 10, 10); }
      ctx.globalAlpha = 1;
      label(w.name, 33, y + 2, w.owned ? '#e8e8f0' : '#8a90b0');
    });
    for (const it of items) {
      const hover = mouse.sx >= it.x && mouse.sx <= it.x + it.w && mouse.sy >= it.y && mouse.sy <= it.y + it.h;
      const ok = !it.cost || canPay(it.cost);
      let bg = it.maxed ? '#26262e' : ok ? (hover ? '#3c6a48' : '#2a4a34') : (hover ? '#4a2a34' : '#2e2433');
      if (it.big) bg = hover ? '#5a4a8a' : '#403468';
      ctx.fillStyle = bg; ctx.fillRect(it.x, it.y, it.w, it.h);
      ctx.fillStyle = it.maxed ? '#4a4a58' : ok ? '#6fe08a' : '#6a5870'; ctx.fillRect(it.x, it.y, 1, it.h);
      label(it.text, it.x + 5, it.y + (it.h - 8) / 2 + 1, it.maxed ? '#8a8a98' : ok || it.big ? '#ffffff' : '#a090a8');
    }
    // current stats
    const b = weapons[0];
    label('Tower HP ' + tower.maxHp + '  speed ' + Math.round(towerSpeed()) + '  ballista x' + wDmg(b).toFixed(2) + ' / ' + wInterval(b).toFixed(1) + 's', 14, 150, '#8a90b0');
    label('Hold the mouse on trees and rocks to gather.', 14, 164, '#8a90b0');
    label('Pick up the XP the tower dropped at night.', 14, 178, '#8a90b0');
    label('W wood  S stone  C copper  xp = XP', 14, 192, '#8a90b0');
    label('Keys 1-6 switch owned weapons on/off.', 14, 206, '#8a90b0');
    if (menuOk > 0) { ctx.globalAlpha = menuOk * 2; ctx.fillStyle = '#6fe08a'; ctx.fillRect(8, 240, 464, 2); ctx.globalAlpha = 1; }
    if (menuDeny > 0) { ctx.globalAlpha = menuDeny * 2; ctx.fillStyle = '#e05a5a'; ctx.fillRect(8, 240, 464, 2); ctx.globalAlpha = 1; }
  }

  // Big centre-screen banners ("DAY 2", "NIGHT 2")
  function drawBanner(label) {
    if (!banner) return;
    const a = Math.max(0, Math.min(1, banner.t / 0.35, (banner.dur - banner.t) / 0.7));
    ctx.globalAlpha = a; ctx.textAlign = 'center';
    ctx.font = '16px monospace';
    const y = 36 + Math.round((1 - a) * -6);
    ctx.fillStyle = '#000'; ctx.fillText(banner.text, VIEW_W / 2 + 1, y + 1); ctx.fillStyle = '#ffe9a0'; ctx.fillText(banner.text, VIEW_W / 2, y);
    ctx.font = '8px monospace';
    label(banner.sub, VIEW_W / 2, y + 20, '#cfd6ff');
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }

  const MOON = ['..XXXX.', '.XXX...', 'XXX....', 'XXX....', 'XXX....', '.XXX...', '..XXXX.'];
  // Going-to-sleep feedback: a "good night" card with what the day earned, a moon, and sleepy dots.
  function drawBedOverlay(label) {
    const t = bed.t;
    if (t < 0) {
      ctx.textAlign = 'center';
      label('Nightfall... time for bed', VIEW_W / 2, 30, '#cfd6ff'); ctx.textAlign = 'left';
      return;
    }
    if (t > 4.8) return;
    const a = Math.max(0, Math.min(1, t / 0.6, (4.8 - t) / 0.9));
    ctx.globalAlpha = a;
    const W = 230, H = 92, x = Math.round(VIEW_W / 2 - W / 2), y = 44;
    ctx.fillStyle = 'rgba(8,10,26,0.9)'; ctx.fillRect(x, y, W, H);
    ctx.fillStyle = '#3a4268'; ctx.fillRect(x, y, W, 1); ctx.fillRect(x, y + H - 1, W, 1); ctx.fillRect(x, y, 1, H); ctx.fillRect(x + W - 1, y, 1, H);
    for (let r = 0; r < MOON.length; r++) for (let c = 0; c < MOON[r].length; c++) if (MOON[r][c] === 'X') { ctx.fillStyle = '#f2e6b0'; ctx.fillRect(x + W - 22 + c * 2, y + 8 + r * 2, 2, 2); }
    for (const [sx, sy] of [[16, 12], [40, 26], [70, 14], [W - 40, 30], [30, 70]]) { ctx.fillStyle = Math.sin(t * 4 + sx) > 0 ? '#ffffff' : '#8a90b0'; ctx.fillRect(x + sx, y + sy, 1, 1); }
    ctx.textAlign = 'center';
    ctx.font = '12px monospace';
    ctx.fillStyle = '#000'; ctx.fillText('DAY ' + nightNo + ' COMPLETE', VIEW_W / 2 + 1, y + 10); ctx.fillStyle = '#ffe9a0'; ctx.fillText('DAY ' + nightNo + ' COMPLETE', VIEW_W / 2, y + 9);
    ctx.font = '8px monospace';
    const names = [['wood', 'WOOD'], ['stone', 'STONE'], ['copper', 'COPPER'], ['iron', 'IRON'], ['crystal', 'CRYSTAL'], ['xp', 'XP']].filter(([k]) => dayGain[k] > 0);
    if (!names.length) label('You gathered nothing today.', VIEW_W / 2, y + 30, '#aab2d8');
    else {
      label('GATHERED', VIEW_W / 2, y + 28, '#aab2d8');
      const half = Math.ceil(names.length / 2);
      [names.slice(0, half), names.slice(half)].forEach((rowN, i) => {
        if (rowN.length) label(rowN.map(([k, n]) => n + ' +' + dayGain[k]).join('   '), VIEW_W / 2, y + 40 + i * 11, '#e8e8f0');
      });
    }
    label('Sleeping' + '.'.repeat(1 + Math.floor(t * 2.2) % 3), VIEW_W / 2, y + H - 14, '#cfd6ff');
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }

  // The tower's face. Eyes open at night and follow the action; the window doubles as its mouth when it yawns.
  function updateEye(dt) {
    const e = tower.eye;
    if (phase === 'night') {
      e.open += (1 - e.open) * (1 - Math.exp(-10 * dt));
      const t = nearestZombieTo(tower.x, tower.y);
      const want = t ? Math.max(-1, Math.min(1, (t.x - tower.x) / 90)) : tower.dirx;
      e.look += (want - e.look) * (1 - Math.exp(-8 * dt));
      e.mouth *= Math.exp(-10 * dt);
      e.nextBlink -= dt;
      if (e.nextBlink <= 0) { e.blink = 0.12; e.nextBlink = rand(2, 5); }
      if (e.blink > 0) e.blink -= dt;
    } else if (phase === 'day') {
      e.open += (0 - e.open) * (1 - Math.exp(-6 * dt)); e.look *= Math.exp(-6 * dt); e.mouth *= Math.exp(-8 * dt);
    }
  }

  function clickedTower() {
    return nearTower() && Math.abs(mouse.wx - tower.x) < 26 && mouse.wy > tower.y - TOWER_H - 20 && mouse.wy < towerBaseY() + 4;
  }
  function openWorkshop() {
    if (!nearTower()) { floatText(mage.x, mage.y - 16, 'GET CLOSER', '#e8e8f0'); return; }
    menu = true; mouse.down = false;
  }

  // Keep a ring of trees and rocks around wherever the tower has rooted. Far-away ones are dropped.
  function topUpNodes() {
    const cx = tower.x, cy = towerBaseY();
    nodes = nodes.filter(n => dist2(n.x, n.y, cx, cy) < (NODE_RING_MAX + 80) ** 2);
    const have = {}; for (const k in NODE_TYPES) have[k] = 0;
    for (const n of nodes) have[n.type]++;
    let tries = 0;
    while (tries++ < 3000) {
      const lacking = Object.keys(NODE_TYPES).filter(k => have[k] < NODE_TYPES[k].want);
      if (!lacking.length) break;
      const type = lacking[Math.floor(Math.random() * lacking.length)], T = NODE_TYPES[type];
      const a = Math.random() * 6.28;
      const r = T.from + Math.sqrt(Math.random()) * (NODE_RING_MAX - T.from);
      const x = Math.round(cx + Math.cos(a) * r), y = Math.round(cy + Math.sin(a) * r * 0.8);
      const gapT = T.gap || 18;
      if (nodes.some(n => dist2(n.x, n.y, x, y) < Math.max(gapT, NODE_TYPES[n.type].gap || 18) ** 2)) continue;
      nodes.push({ type, x, y, hp: T.hp, maxHp: T.hp, r: T.r, shake: 0, flash: 0, dying: 0, spr: T.sprs ? T.sprs[Math.floor(Math.random() * T.sprs.length)] : T.spr });
      have[type]++;
    }
  }

  // ---------- Night ----------
  function spawnZombie() {
    if (zombies.length >= MAX_ZOMBIES) return;
    // spawn on a random point just outside the visible rectangle, around the camera
    const side = Math.floor(Math.random() * 4);
    const hw = VIEW_W / 2 / zoom + SPAWN_MARGIN, hh = VIEW_H / 2 / zoom + SPAWN_MARGIN;
    let x, y;
    if (side === 0) { x = rand(-hw, hw); y = -hh; }
    else if (side === 1) { x = rand(-hw, hw); y = hh; }
    else if (side === 2) { x = -hw; y = rand(-hh, hh); }
    else { x = hw; y = rand(-hh, hh); }
    zombies.push({
      x: camX + x, y: camY + y,
      speed: rand(ZOMBIE_SPEED_MIN, ZOMBIE_SPEED_MAX) * (1 + Math.min(time / 180, 0.8)),
      hp: ZOMBIE_HP, flash: 0, wob: Math.random() * 6.28,
      kx: 0, ky: 0, dir: 1, slow: 0, orbCd: 0
    });
  }

  // ---------- Weapons ----------
  // Six mounts on the tower. Each weapon sits on its own mount, fires on its own timer and attacks in its own way.
  // Keys 1-6 toggle them for testing (TEMPORARY: in the real game they're bought with resources by day).
  const WEAPON_DEFS = [
    { id: 'ballista', flips: true, name: 'BALLISTA', slot: 0, interval: FIRE_INTERVAL, spr: 'w_ballista', color: '#f2e6b0' },
    { id: 'cannon', flips: true,   name: 'CANNON',   slot: 1, interval: 3.2, spr: 'w_cannon',   color: '#ff9a3a' },
    { id: 'coil',     name: 'COIL',     slot: 2, interval: 2.6, spr: 'w_coil',     color: '#6fe8ff' },
    { id: 'frost',    name: 'FROST',    slot: 3, interval: 2.4, spr: 'w_frost',    color: '#bfe8ff' },
    { id: 'catapult', flips: true, name: 'CATAPULT', slot: 4, interval: 4.2, spr: 'w_catapult', color: '#b8b8c8' },
    { id: 'orb',      name: 'ORBS',     slot: 5, interval: 0,   spr: 'w_orb',      color: '#b070ff' },
  ];
  // Mount points: bottom-centre of each weapon, in body-sprite pixels from the body's top-left corner.
  const SLOTS = [[19, 21], [32, 16], [45, 21], [9, 46], [55, 46], [32, 68]];
  const SLOT_DRAW_ORDER = [1, 0, 2, 3, 4, 5];       // back of the roof first
  const ORB_COUNT = 3, ORB_RX = 46, ORB_RY = 15, ORB_SPEED = 2.6;
  const COIL_RANGE = 190, CHAIN_RANGE = 48;

  // Top-left of the body sprite in world space, including this frame's bob and sway.
  function bodyOrigin() {
    return { x: tower.x - BODY_W / 2 + tower.bodyX, y: towerBaseY() - LEG_VIS - BODY_H + tower.bodyY };
  }
  function weaponBase(w) { const o = bodyOrigin(), s = SLOTS[w.slot]; return { x: o.x + s[0], y: o.y + s[1] }; }
  function orbPos(i) {
    const a = orbAng + i * 6.2832 / orbCount();
    return { x: tower.x + tower.bodyX + Math.cos(a) * ORB_RX, y: towerBaseY() - LEG_VIS - 30 + tower.bodyY + Math.sin(a) * ORB_RY,
             front: Math.sin(a) > 0 };
  }

  function nearestZombieTo(x, y, maxD = Infinity, skip = null) {
    let best = null, bd = maxD * maxD;
    for (const z of zombies) {
      if (skip && skip.includes(z)) continue;
      const d = dist2(z.x, z.y, x, y);
      if (d < bd) { bd = d; best = z; }
    }
    return best;
  }

  function hurtZombie(z, dmg, kx, ky, color) {
    z.hp -= dmg; z.flash = 0.1; z.kx = kx; z.ky = ky;
    burst(z.x, z.y, color, 5, 60);
  }

  // Area damage with a shock ring; full damage in the inner half, one less at the edge.
  function splash(x, y, r, dmg, color) {
    for (const z of zombies) {
      const d = Math.hypot(z.x - x, z.y - y);
      if (d >= r) continue;
      const k = 1 - d / r, a = Math.atan2(z.y - y, z.x - x);
      hurtZombie(z, d < r * 0.5 ? dmg : Math.max(dmg * 0.5, dmg - 1), Math.cos(a) * 60 * (0.4 + k), Math.sin(a) * 60 * (0.4 + k), color);
    }
    rings.push({ x, y, max: r, life: 0.3, t: 0.3, color });
  }

  // A jagged lightning path between two points (stable per bolt so it doesn't flicker randomly).
  function jag(ax, ay, bx, by) {
    const pts = [[ax, ay]], n = 6;
    for (let i = 1; i < n; i++) {
      const t = i / n;
      pts.push([ax + (bx - ax) * t + rand(-5, 5), ay + (by - ay) * t + rand(-5, 5)]);
    }
    pts.push([bx, by]);
    return pts;
  }

  function fireWeapon(w) {
    const b = weaponBase(w), mx = b.x, my = b.y - 9;
    const t = nearestZombieTo(mx, my, w.id === 'coil' ? COIL_RANGE : Infinity);
    if (!t) { w.timer = 0.12; return; }              // hold fire until something is in range, then shoot promptly
    w.timer = wInterval(w); w.face = t.x < mx ? -1 : 1; w.kick = 1;
    const D = wDmg(w);
    const a = Math.atan2(t.y - my, t.x - mx);
    const ca = Math.cos(a), sa = Math.sin(a);

    if (w.id === 'ballista') {
      shots.push({ kind: 'arrow', x: mx, y: my, vx: ca * ARROW_SPEED, vy: sa * ARROW_SPEED, a, life: ARROW_LIFE, dmg: ARROW_DAMAGE * D });
      burst(mx + ca * 8, my + sa * 8, '#f2e6b0', 4, 40);
      shake = Math.max(shake, 1);
    } else if (w.id === 'cannon') {
      shots.push({ kind: 'fire', x: mx + ca * 8, y: my + sa * 8, vx: ca * 135, vy: sa * 135, a, life: 2.4, dmg: 3 * D });
      burst(mx + ca * 10, my + sa * 10, '#ffb04a', 9, 70);
      burst(mx + ca * 10, my + sa * 10, '#555a66', 5, 35);   // smoke
      shake = Math.max(shake, 2);
    } else if (w.id === 'coil') {
      // lightning strikes the nearest zombie, then jumps to up to two more nearby
      const chain = [t];
      for (let i = 0; i < 2; i++) {
        const last = chain[chain.length - 1], nx = nearestZombieTo(last.x, last.y, CHAIN_RANGE, chain);
        if (!nx) break; chain.push(nx);
      }
      let px = mx, py = my;
      const path = [], hits = [];
      for (const z of chain) {
        path.push(jag(px, py, z.x, z.y - 6)); hits.push([z.x, z.y]);
        hurtZombie(z, 2 * D, 0, 0, '#9cf3ff');
        px = z.x; py = z.y - 6;
      }
      zaps.push({ path, hits, life: 0.22, max: 0.22 });
      burst(mx, my, '#6fe8ff', 6, 50);
      shake = Math.max(shake, 1.2);
    } else if (w.id === 'frost') {
      for (const off of [-0.22, 0, 0.22]) {
        const aa = a + off;
        shots.push({ kind: 'shard', x: mx, y: my, vx: Math.cos(aa) * 190, vy: Math.sin(aa) * 190, a: aa, life: 1.3, dmg: 1 * D });
      }
      burst(mx + ca * 6, my + sa * 6, '#d8f3ff', 5, 45);
    } else if (w.id === 'catapult') {
      // lobbed boulder: lands where the target is heading, splashes on impact
      const T = 0.95, z = t, d = Math.hypot(tower.x - z.x, tower.y - z.y) || 1;
      const lead = Math.min(d, z.speed * T);
      const tx = z.x + (tower.x - z.x) / d * lead, ty = z.y + (tower.y - z.y) / d * lead;
      shots.push({ kind: 'rock', sx: mx, sy: my, tx, ty, t: 0, T, x: mx, y: my, dmg: 4 * D });
      burst(mx, my - 2, '#9a8a6a', 5, 35);
      shake = Math.max(shake, 1.2);
    }
  }

  function updateWeapons(dt) {
    for (const w of weapons) {
      w.kick *= Math.exp(-12 * dt);
      if (!w.on || w.interval <= 0) continue;
      w.timer -= dt;
      if (w.timer <= 0) fireWeapon(w);
    }

    // Orbiting arcane orbs: constant contact damage in a ring around the tower
    if (weapons[5].on) {
      orbAng += dt * ORB_SPEED;
      for (let i = 0; i < orbCount(); i++) {
        const o = orbPos(i);
        for (const z of zombies) {
          if (z.orbCd > 0 || Math.abs(z.x - o.x) > 9 || Math.abs(z.y - o.y) > 9) continue;
          const a = Math.atan2(z.y - tower.y, z.x - tower.x);
          hurtZombie(z, wDmg(weapons[5]), Math.cos(a) * 45, Math.sin(a) * 45, '#c490ff');
          z.orbCd = 0.35;
        }
      }
    }

    // Projectiles
    for (let i = shots.length - 1; i >= 0; i--) {
      const s = shots[i];
      if (s.kind === 'rock') {
        s.t += dt;
        const u = Math.min(1, s.t / s.T);
        s.x = s.sx + (s.tx - s.sx) * u; s.y = s.sy + (s.ty - s.sy) * u;
        s.h = Math.sin(u * Math.PI) * 70;
        if (u >= 1) {
          splash(s.tx, s.ty, 26, s.dmg, '#b8b8c8');
          burst(s.tx, s.ty, '#8a7a5a', 14, 70);
          shake = Math.max(shake, 3.2);
          shots.splice(i, 1);
        }
        continue;
      }
      const nx = s.x + s.vx * dt, ny = s.y + s.vy * dt;
      s.life -= dt;
      const reach = s.kind === 'arrow' ? ZOMBIE_SIZE * 0.75 : s.kind === 'fire' ? 9 : 8;
      let hit = null;
      for (const z of zombies) {
        for (let k = 0; k <= 1; k += 0.5) {         // check start, middle and end of this frame's travel
          const px = s.x + (nx - s.x) * k, py = s.y + (ny - s.y) * k;
          if (Math.abs(px - z.x) < reach && Math.abs(py - z.y) < reach) { hit = z; break; }
        }
        if (hit) break;
      }
      s.x = nx; s.y = ny;
      if (s.kind === 'fire' && Math.random() < 0.7) particles.push({ x: s.x - s.vx * 0.03, y: s.y - s.vy * 0.03, vx: rand(-8, 8), vy: rand(-8, 8), life: 0.3, max: 0.3, color: Math.random() < 0.5 ? '#ff9a3a' : '#ffd84a' });
      if (hit) {
        if (s.kind === 'arrow') { hurtZombie(hit, s.dmg, s.vx * 0.15, s.vy * 0.15, '#7bd35a'); }
        else if (s.kind === 'fire') { splash(s.x, s.y, 24, s.dmg, '#ff9a3a'); burst(s.x, s.y, '#ffd84a', 10, 80); shake = Math.max(shake, 2.5); }
        else if (s.kind === 'shard') { hurtZombie(hit, s.dmg, s.vx * 0.12, s.vy * 0.12, '#bfe8ff'); hit.slow = 2.2; }
        shots.splice(i, 1);
        continue;
      }
      if (s.life <= 0) shots.splice(i, 1);
    }

    for (let i = zaps.length - 1; i >= 0; i--) { zaps[i].life -= dt; if (zaps[i].life <= 0) zaps.splice(i, 1); }
    for (let i = rings.length - 1; i >= 0; i--) { rings[i].t -= dt; if (rings[i].t <= 0) rings.splice(i, 1); }
  }

  // ---------- Walking ----------
  // Four root-legs in two diagonal pairs. Each leg plants, slides back under the body, lifts and swings forward.
  // Every footfall kicks up dust and thumps the body down, so the tower feels heavy.
  const LEGS = [               // foot offsets from the tower's base centre; back legs first so they draw behind
    { x: -22, y: -5, ph: 0.5 }, { x: 22, y: -5, ph: 0 },
    { x: -11, y: 0,  ph: 0 },   { x: 11,  y: 0,  ph: 0.5 },
  ];
  // The stance foot slides back exactly as far as the body travels during the stance (STRIDE_LEN * STANCE), so planted
  // feet stay put on the ground instead of skating. The swing is eased: slow lift-off, fast middle, soft landing.
  const STRIDE_LEN = 34, STANCE = 0.55, LEG_LIFT = 9;
  const SLIDE = STRIDE_LEN * STANCE;

  function legPose(i) {
    const L = LEGS[i], s = (tower.step + L.ph) % 1, amp = tower.amp;
    let f, lift = 0;
    if (s < STANCE) f = 0.5 - s / STANCE;                        // planted: foot slides from front to back
    else { const u = (s - STANCE) / (1 - STANCE); f = -0.5 + easeIO(u); lift = Math.sin(u * Math.PI) * LEG_LIFT * amp; }
    return { x: tower.x + L.x + tower.dirx * f * SLIDE * amp, y: towerBaseY() + L.y + tower.diry * f * SLIDE * 0.45 * amp, lift };
  }

  function updateGait(dt, rooted) {
    const sp = rooted ? 0 : Math.hypot(tower.vx, tower.vy);
    tower.amp += (Math.min(1, sp / 18) - tower.amp) * (1 - Math.exp(-8 * dt));
    tower.step += sp * dt / STRIDE_LEN;
    if (sp > 1) { tower.dirx = tower.vx / sp; tower.diry = tower.vy / sp; }
    tower.sink += ((rooted ? 1 : 0) - tower.sink) * (1 - Math.exp(-4 * dt));
    for (let i = 0; i < 4; i++) {
      const s = (tower.step + LEGS[i].ph) % 1;
      if (tower.legS[i] > 0.8 && s < 0.2 && tower.amp > 0.35) {    // this leg just came down
        const p = legPose(i);
        burst(p.x, p.y, '#6b5a48', 4, 26);
        tower.thump = 1; shake = Math.max(shake, 0.9);
      }
      tower.legS[i] = s;
    }
    tower.thump *= Math.exp(-9 * dt);
    const avgBury = (tower.bury[0] + tower.bury[1] + tower.bury[2] + tower.bury[3]) / 4;
    const breathe = Math.sin(performance.now() / 550) * 0.6 * (1 - tower.amp);
    tower.bodyY = Math.cos(tower.step * 4 * Math.PI) * 1.2 * tower.amp + tower.thump * 1.6 + breathe + avgBury * 10;
    tower.bodyX = tower.dirx * tower.amp * 2.2 + Math.sin(tower.step * 6.2832) * 1.2 * tower.amp;
  }

  function updateNight(dt) {
    time += dt;
    if (time >= NIGHT_LENGTH) { startDawn(); return; }

    // Tower movement (WASD), smoothed for weight
    let ix = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    let iy = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
    const len = Math.hypot(ix, iy) || 1;
    ix /= len; iy /= len;
    const k = 1 - Math.exp(-TOWER_ACCEL * dt);
    tower.vx += (ix * towerSpeed() - tower.vx) * k;
    tower.vy += (iy * towerSpeed() - tower.vy) * k;
    tower.x += tower.vx * dt; tower.y += tower.vy * dt;
    updateGait(dt, false);
    if (tower.vx > 2) tower.facing = 1; else if (tower.vx < -2) tower.facing = -1;
    if (tower.hitFlash > 0) tower.hitFlash -= dt;
    if (up.regen) tower.hp = Math.min(tower.maxHp, tower.hp + 1.5 * up.regen * dt);

    // Spawning: ramps up through the night, and each night starts a little busier
    if (zoom < NIGHT_ZOOM * 1.5) {               // wait until the camera has pulled back out
      const rate = 1.2 + time * 0.045 + (nightNo - 1) * 0.6;   // zombies per second
      spawnTimer += dt * rate;
      while (spawnTimer >= 1) { spawnTimer -= 1; spawnZombie(); }
    }

    updateWeapons(dt);

    // Zombies
    for (let i = zombies.length - 1; i >= 0; i--) {
      const z = zombies[i];
      if (z.hp <= 0) {
        xpDrops.push({ x: z.x, y: z.y, bob: Math.random() * 6.28 });
        burst(z.x, z.y, '#4f8a3a', 8, 70);
        kills++; shake = Math.max(shake, 1.5);
        zombies.splice(i, 1);
        continue;
      }
      const dx = tower.x - z.x, dy = tower.y - z.y;
      const d = Math.hypot(dx, dy) || 1;
      z.wob += dt * 6;
      if (Math.abs(dx) > 1) z.dir = dx < 0 ? -1 : 1;
      let spd = z.speed;
      if (z.slow > 0) { z.slow -= dt; spd *= 0.45; if (Math.random() < dt * 6) particles.push({ x: z.x + rand(-4, 4), y: z.y + rand(-6, 4), vx: 0, vy: -6, life: 0.4, max: 0.4, color: '#bfe8ff' }); }
      if (z.orbCd > 0) z.orbCd -= dt;
      z.x += (dx / d) * spd * dt + z.kx * dt * 8;
      z.y += (dy / d) * spd * dt + z.ky * dt * 8;
      z.kx *= 0.85; z.ky *= 0.85;
      if (z.flash > 0) z.flash -= dt;

      // soft separation so they don't stack into one pixel (cheap, checks a few neighbours)
      for (let j = i - 1, c = 0; j >= 0 && c < 6; j--, c++) {
        const o = zombies[j];
        const ox = z.x - o.x, oy = z.y - o.y, od2 = ox * ox + oy * oy;
        if (od2 < 100 && od2 > 0.01) {
          const od = Math.sqrt(od2), push = (10 - od) * 0.5;
          z.x += (ox / od) * push * dt * 20; z.y += (oy / od) * push * dt * 20;
        }
      }

      // touch damage
      if (Math.abs(z.x - tower.x) < TOWER_W / 2 + 2 && Math.abs(z.y - (tower.y - TOWER_H / 4)) < TOWER_H / 2) {
        tower.hp -= 6 * dt * Math.pow(0.88, up.armor);
        tower.hitFlash = 0.1;
        shake = Math.max(shake, 0.8);
        if (tower.hp <= 0) { tower.hp = 0; gameOver = true; }
      }
    }
  }

  // ---------- Day ----------
  // Push a circle (the mage) out of another circle. Used for trees, rocks and the tower's rooted base.
  function pushOut(cx, cy, r) {
    const dx = mage.x - cx, dy = mage.y - cy, d = Math.hypot(dx, dy), min = r + MAGE_R;
    if (d < min && d > 0.001) { mage.x = cx + dx / d * min; mage.y = cy + dy / d * min; }
  }

  // The tree or rock the player is clicking on: within reach of the mage, and nearest to the cursor.
  function pickTarget() {
    let best = null, bd = Infinity;
    for (const n of nodes) {
      if (n.dying > 0) continue;
      const cy = n.y - NODE_TYPES[n.type].cy * 0.6;                 // aim at the body, not the base
      if (dist2(n.x, n.y, mage.x, mage.y) > (REACH + reachBonus() + n.r) ** 2) continue;
      const dm = Math.min(dist2(n.x, cy, mouse.wx, mouse.wy), dist2(n.x, n.y, mouse.wx, mouse.wy));
      if (dm > (CLICK_SLOP + 6) ** 2) continue;
      if (dm < bd) { bd = dm; best = n; }
    }
    return best;
  }

  // Broken nodes pop their drops into the air as loot; loot lands, then flies to the smith (see updateLoot).
  function spawnLoot(type, x, y, z, count) {
    for (let i = 0; i < count; i++)
      loot.push({ type, x: x + rand(-3, 3), y: y + rand(-2, 3), z, vx: rand(-34, 34), vy: rand(-18, 18), vz: rand(70, 105), age: 0, bounced: false, landed: false });
  }

  function collectLoot(l) {
    res[l.type]++; dayGain[l.type]++; hudBump[l.type] = 0.3;
    burst(l.x, l.y - l.z, RES_COLOR[l.type], 4, 26);
  }

  function updateLoot(dt) {
    for (let i = loot.length - 1; i >= 0; i--) {
      const l = loot[i];
      l.age += dt;
      if (!l.landed) {
        l.vz -= 260 * dt; l.z += l.vz * dt; l.x += l.vx * dt; l.y += l.vy * dt;
        if (l.z <= 0) {
          l.z = 0;
          if (!l.bounced && l.vz < -40) { l.vz = -l.vz * 0.4; l.bounced = true; l.vx *= 0.4; l.vy *= 0.4; }
          else l.landed = true;
        }
      } else if (l.age > 0.55) {                                        // let it sit for a beat, then it's drawn in
        const dx = mage.x - l.x, dy = (mage.y - 4) - l.y, d = Math.hypot(dx, dy) || 1;
        const sp = Math.min(240, 70 + (l.age - 0.55) * 340);
        l.x += dx / d * sp * dt; l.y += dy / d * sp * dt;
        if (d < 5) { collectLoot(l); loot.splice(i, 1); }
      }
    }
  }

  function hitNode(n) {
    const T = NODE_TYPES[n.type];
    const crit = Math.random() < 0.15 * up.power;
    n.hp -= crit ? 2 : 1; n.shake = 0.15; n.flash = 0.08;
    burst(n.x, n.y - T.cy, T.chip, crit ? 9 : 5, 34);
    if (n.type === 'tree') burst(n.x, n.y - T.h * 0.7, '#3f7a3a', 2, 24);          // a few leaves
    if (crit) floatText(n.x, n.y - T.h - 2, 'CRIT!', '#ffe9a0');
    shake = Math.max(shake, crit ? 1.4 : 0.7); hitstop = Math.max(hitstop, crit ? 0.05 : 0.028);
    if (n.hp > 0) return;

    n.dying = 0.25; hitstop = 0.075; shake = Math.max(shake, 2.2);
    burst(n.x, n.y - T.cy, T.chip, 14, 60);
    if (n.type === 'tree') burst(n.x, n.y - T.h * 0.6, '#3f7a3a', 12, 50);
    T.drops.forEach(([what, lo, hi], i) => {
      let c = lo + Math.floor(Math.random() * (hi - lo + 1));
      if (i === 0 && Math.random() < 0.2 * up.yield) c++;
      if (c > 0) spawnLoot(what, n.x, n.y, T.cy, c);
    });
    if (T.rare) { floatText(n.x, n.y - T.h - 6, 'RARE: ' + T.rare, RES_COLOR[T.drops[0][0]]); shake = Math.max(shake, 3.4); burst(n.x, n.y - T.cy, '#ffffff', 14, 70); }
  }

  function updateDay(dt) {
    // Movement (WASD)
    let ix = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
    let iy = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
    const len = Math.hypot(ix, iy) || 1;
    ix /= len; iy /= len;
    if (toWorkshop) {                                              // dusk: walk to the front of the tower by himself
      walkT += dt;
      const tx = tower.x, ty = towerBaseY() + 26, dx = tx - mage.x, dy = ty - mage.y, d = Math.hypot(dx, dy);
      if (d < 5 || walkT > 6) { toWorkshop = false; menu = true; mouse.down = false; ix = iy = 0; }
      else { ix = dx / d; iy = dy / d; }
    }
    const k = 1 - Math.exp(-MAGE_ACCEL * dt);
    mage.vx += (ix * mageSpeed() - mage.vx) * k;
    mage.vy += (iy * mageSpeed() - mage.vy) * k;
    mage.x += mage.vx * dt; mage.y += mage.vy * dt;
    mage.step += Math.hypot(mage.vx, mage.vy) * dt * 0.35;
    for (const n of nodes) if (!(n.dying > 0)) pushOut(n.x, n.y, n.r);
    pushOut(tower.x, towerBaseY() - 4, 24);
    updateGait(dt, true);

    if (!menu && !toWorkshop && !dusk) dayTime -= dt;
    if (menu && !nearTower()) menu = false;
    if (dayTime <= 0 && !dusk) beginDusk();
    if (dusk && !menu && !toWorkshop) { goToBed(); return; }      // closed the workshop: off to bed

    // Always face the mouse
    mage.aim = Math.atan2(mouse.wy - (mage.y - 6), mouse.wx - mage.x);
    if (mouse.wx < mage.x - 2) mage.flip = true; else if (mouse.wx > mage.x + 2) mage.flip = false;

    // Chop / mine: hold the mouse to keep swinging
    if (mage.swingCd > 0) mage.swingCd -= dt;
    if (mage.swing > 0) mage.swing -= dt;
    if (mouse.down && !menu && !toWorkshop && mage.swingCd <= 0) {
      mage.swingCd = swingCd(); mage.swing = 0.18; mage.swingDir = mage.aim;
      const n = pickTarget();
      if (n) hitNode(n);
    }

    updateLoot(dt);

    // XP: drifts toward the mage when close, collected on touch
    for (let i = xpDrops.length - 1; i >= 0; i--) {
      const d = xpDrops[i];
      const dx = mage.x - d.x, dy = (mage.y - 3) - d.y, dd = Math.hypot(dx, dy);
      if (dd < XP_PICKUP) {
        xpDrops.splice(i, 1); res.xp++; dayGain.xp++; hudBump.xp = 0.3;
        burst(d.x, d.y, '#3fb6ff', 4, 25);
        continue;
      }
      if (dd < xpMagnet()) { const p = (1 - dd / xpMagnet()) * 90 + 20; d.x += dx / dd * p * dt; d.y += dy / dd * p * dt; }
    }
  }

  // ---------- Update ----------
  function update(dt) {
    if (gameOver) return;
    if (hitstop > 0) { hitstop -= dt; return; }          // a few frames of freeze on a hit makes it land
    if (banner) { banner.t += dt; if (banner.t > banner.dur) banner = null; }
    for (const k in hudBump) if (hudBump[k] > 0) hudBump[k] -= dt;

    // ease the zoom in log space so in and out feel the same speed
    if (phase !== 'bed') {
      const zk = 1 - Math.exp(-ZOOM_EASE * dt);
      zoom = Math.exp(Math.log(zoom) + (Math.log(zoomTarget) - Math.log(zoom)) * zk);
      if (Math.abs(zoom - zoomTarget) < 0.002) zoom = zoomTarget;
    }
    if (phase === 'bed') dayLight = bed.t < 0 ? 1 : 1 - easeIO(seg(bed.t, 0.2, 3.6));   // dusk falls while the mage sleeps
    else if (phase === 'dawn') dayLight = easeIO(seg(dawnT, 0.8, 3.4));
    else dayLight += ((phase === 'day' ? 1 : 0) - dayLight) * (1 - Math.exp(-2 * dt));
    if (menuOk > 0) menuOk -= dt;
    if (menuDeny > 0) menuDeny -= dt;

    if (phase === 'night') updateNight(dt);
    else if (phase === 'day') updateDay(dt);
    else if (phase === 'bed') updateBed(dt);
    else updateDawn(dt);
    updateEye(dt);

    // mouse in world space (uses last frame's camera, close enough)
    mouse.wx = (mouse.sx - camTx) / zoom; mouse.wy = (mouse.sy - camTy) / zoom;

    // Camera follows whoever you're playing
    if (phase !== 'bed') {
      const onTower = phase === 'night' || (phase === 'dawn' && dawnT < 2.2);
      const fx = onTower ? tower.x : mage.x, fy = onTower ? tower.y : mage.y - 6;
      const ck = 1 - Math.exp(-(phase === 'day' ? 22 : 6) * dt);
      camX += (fx - camX) * ck; camY += (fy - camY) * ck;
    }

    for (const x of xpDrops) x.bob += dt * 3;
    for (const n of nodes) { if (n.shake > 0) n.shake -= dt; if (n.flash > 0) n.flash -= dt; if (n.dying > 0) { n.dying -= dt; if (n.dying <= 0) n.gone = true; } }
    if (nodes.some(n => n.gone)) nodes = nodes.filter(n => !n.gone);

    // Particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floaters.length - 1; i >= 0; i--) {
      const f = floaters[i]; f.life -= dt; f.y -= 8 * dt;
      if (f.life <= 0) floaters.splice(i, 1);
    }

    shake *= Math.exp(-10 * dt);
  }

  // ---------- Render ----------
  // The world is drawn in world coordinates under a zoom transform. snap() rounds to whole screen pixels,
  // so movement stays smooth at any zoom while edges stay crisp.
  const snap = v => Math.round(v * zoom) / zoom;
  function rect(x, y, w, h, c) { ctx.fillStyle = c; ctx.fillRect(snap(x), snap(y), w, h); }

  // Soft ground shadow for sprites.
  function shadow(x, y, w, h) { ctx.globalAlpha = 0.4; rect(x, y, w, h, '#07080f'); ctx.globalAlpha = 1; }

  // Draw an image anchored at (x, y); ax/ay are 0..1 anchor within the image (0.5, 1 = bottom-centre).
  function drawSprite(img, x, y, ax = 0.5, ay = 0.5, flip = false) {
    const top = snap(y - img.height * ay);
    if (!flip) { ctx.drawImage(img, snap(x - img.width * ax), top); return; }
    ctx.save();
    ctx.translate(snap(x), 0); ctx.scale(-1, 1);
    ctx.drawImage(img, Math.round(-img.width * (1 - ax)), top);
    ctx.restore();
  }

  // deterministic ground tiles so the world has a sense of movement
  function hash(x, y) { let h = x * 374761393 + y * 668265263; h = (h ^ (h >> 13)) * 1274126177; return ((h ^ (h >> 16)) >>> 0) / 4294967295; }

  function drawGrassTile(hw, hh) {
    if (!sprites.grass || dayLight < 0.01) return;
    const T = 32, x0 = Math.floor((camX - hw) / T) - 1, x1 = Math.floor((camX + hw) / T) + 1;
    const y0 = Math.floor((camY - hh) / T) - 1, y1 = Math.floor((camY + hh) / T) + 1;
    ctx.globalAlpha = dayLight;
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) ctx.drawImage(sprites.grass, tx * T, ty * T);
    ctx.globalAlpha = 1;
  }

  function drawGround(hw, hh) {
    const T = 16;
    const x0 = Math.floor((camX - hw) / T) - 1, x1 = Math.floor((camX + hw) / T) + 1;
    const y0 = Math.floor((camY - hh) / T) - 1, y1 = Math.floor((camY + hh) / T) + 1;
    for (let ty = y0; ty <= y1; ty++) {
      for (let tx = x0; tx <= x1; tx++) {
        const h = hash(tx, ty);
        const sx = tx * T, sy = ty * T;
        if (sprites.ground) { ctx.drawImage(sprites.ground, sx, sy); continue; }
        rect(sx, sy, T, T, (tx + ty) & 1 ? '#161b2b' : '#141828');
        if (h > 0.86) rect(sx + (h * 97 % 10), sy + (h * 53 % 10), 2, 2, '#232b45');       // pebbles
        else if (h < 0.06) { rect(sx + 4, sy + 6, 1, 3, '#1d3a2a'); rect(sx + 6, sy + 5, 1, 4, '#1d3a2a'); } // grass tufts
      }
    }
  }

  // Grass tufts, flowers and mushrooms scattered by a hash so they stay put. They fade in with the daylight, sway in
  // the wind, and bend away from the smith as he walks through.
  const TUFTS = [['grass_s', 40], ['grass_tall', 18], ['grass_daisy', 12], ['grass_violet', 9], ['grass_mush', 5], ['fern', 8]];
  function drawGrass(hw, hh) {
    if (dayLight < 0.02) return;
    const C = 14, x0 = Math.floor((camX - hw) / C) - 1, x1 = Math.floor((camX + hw) / C) + 1;
    const y0 = Math.floor((camY - hh) / C) - 1, y1 = Math.floor((camY + hh + 8) / C) + 1;
    const total = TUFTS.reduce((a, t) => a + t[1], 0), showMage = phase === 'day' || phase === 'dawn';
    ctx.globalAlpha = dayLight;
    const items = [];
    for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
      const h = hash(tx * 7 + 3, ty * 13 + 5);
      if (h > 0.45) continue;                                          // under half the cells have a tuft
      const h2 = hash(tx + 101, ty + 57), h3 = hash(tx + 11, ty + 301);
      let r = h3 * total, key = TUFTS[0][0];
      for (const [k, wgt] of TUFTS) { if (r < wgt) { key = k; break; } r -= wgt; }
      const img = sprites[key]; if (!img) continue;
      items.push([tx * C + h2 * (C - 2) + 1, ty * C + hash(tx + 77, ty + 9) * (C - 2) + 6, img, h]);
    }
    items.sort((a, b) => a[1] - b[1]);
    for (const [x, y, img, h] of items) {
      let sway = windAt(x) * 1.2 + Math.sin(performance.now() / 700 + h * 20) * 0.25;
      if (showMage) {                                                  // bend away from the smith
        const dx = x - mage.x, dy = y - mage.y, d = Math.hypot(dx, dy * 1.6);
        if (d < 13) sway += (dx >= 0 ? 1 : -1) * (1 - d / 13) * 3.2;
      }
      drawSway(img, x, y, sway);
    }
    ctx.globalAlpha = 1;
  }

  function drawZombie(z) {
    const bob = Math.sin(z.wob) > 0 ? 1 : 0;
    if (sprites.zombie) {
      const img = z.flash > 0 && flashes.zombie ? flashes.zombie : sprites.zombie;
      shadow(z.x - 6, z.y + ZOMBIE_SIZE / 2 - 1, 12, 2);
      drawSprite(img, z.x, z.y + ZOMBIE_SIZE / 2 - bob, 0.5, 1, z.dir < 0);
    } else {
      rect(z.x - 3, z.y + 4, 6, 1, '#07080f');
      rect(z.x - 4, z.y - 4 - bob, 8, 8, z.flash > 0 ? '#ffffff' : '#4f8a3a');
      if (z.flash <= 0) { rect(z.x - 2, z.y - 2 - bob, 1, 1, '#ff3b3b'); rect(z.x + 1, z.y - 2 - bob, 1, 1, '#ff3b3b'); }
    }
  }

  function drawTower() {
    const sx = tower.x, sy = tower.y;
    const rooted = phase === 'day';
    const moving = !rooted && Math.hypot(tower.vx, tower.vy) > 3;
    const sway = moving ? Math.sin(tower.step * 6.28) : 0;
    const lift = moving ? Math.abs(Math.sin(tower.step * 6.28)) * 1.5 : 0;
    const sink = rooted ? 2 : 0;               // by day the root-legs are dug into the ground
    if (sprites.tower) {
      const footY = towerBaseY();
      shadow(sx - 22, footY - 4, 44, 2); shadow(sx - 28, footY - 2, 56, 2); shadow(sx - 22, footY, 44, 2);   // soft oval
      drawOrbs(false);                                         // orbs on the far side of the tower
      for (let i = 0; i < 4; i++) {                            // root-legs, back pair first
        const p = legPose(i), bu = tower.bury[i], y = p.y + bu * (LEG_VIS + 2) - p.lift - tower.legPull[i];
        if (!sprites.leg) { rect(p.x - 4, y - 10, 8, 10, '#4a3a2a'); continue; }
        if (bu > 0.02) { ctx.save(); ctx.beginPath(); ctx.rect(p.x - 20, p.y - 80, 40, 81); ctx.clip(); }   // buried part is hidden
        drawSprite(sprites.leg, p.x, y, 0.5, 1);
        if (bu > 0.02) ctx.restore();
      }
      const o = bodyOrigin();
      ctx.drawImage(tower.hitFlash > 0 && flashes.tower ? flashes.tower : sprites.tower, snap(o.x), snap(o.y));
      drawFace(o);
      if (tower.scratch > 0.02) drawScratchArm(o);
      for (const si of SLOT_DRAW_ORDER) {                      // weapons on their mounts
        const w = weapons[si];
        if (!w.on) continue;
        const b = weaponBase(w), kx = -w.face * w.kick * 2.5, img = sprites[w.spr];
        if (img) drawSprite(img, b.x + kx, b.y, 0.5, 1, w.flips && w.face < 0);
        else rect(b.x - 5 + kx, b.y - 8, 10, 8, w.color);
      }
      drawOrbs(true);                                          // orbs on the near side
    } else {
      rect(sx - 10, sy + 10, 20, 3, '#07080f');                               // shadow
      // root-legs (two stubby legs alternating)
      rect(sx - 7, sy + 7 - (sway > 0 ? lift : 0), 4, 5 - sink, '#4a3a2a');
      rect(sx + 3, sy + 7 - (sway < 0 ? lift : 0), 4, 5 - sink, '#4a3a2a');
      const PW = 18, PH = 26;   // placeholder tower size (independent of the hitbox)
      const bx = sx - PW / 2 + sway * 0.6, by = sy - PH / 2 - lift * 0.5 + sink;
      const body = tower.hitFlash > 0 ? '#ffd0d0' : '#8a8f99';
      const dark = tower.hitFlash > 0 ? '#e0a0a0' : '#6a6f79';
      rect(bx, by, PW, PH - 4, body);                               // body
      rect(bx + PW - 4, by, 4, PH - 4, dark);                       // shaded side
      for (let i = 0; i < 3; i++) rect(bx + i * 7 - (i === 0 ? 0 : 1), by - 4, 4, 4, body);   // battlements
      rect(bx, by + 8, PW, 1, dark); rect(bx, by + 15, PW, 1, dark);                         // brick lines
      rect(bx + 7, by + 3, 4, 4, '#1b1f2a'); rect(bx + 8, by + 4, 2, 2, '#ffcf5a');          // window
      if (!rooted) rect(bx + (tower.facing > 0 ? 11 : 4), by + 11, 2, 2, '#ffe9a0');         // eyes: closed by day
    }
    if ((tower.bury[0] + tower.bury[1] + tower.bury[2] + tower.bury[3]) / 4 > 0.3) {   // churned soil where the roots go in
      const fy = sy + TOWER_H / 2;
      rect(sx - 30, fy - 1, 60, 2, '#3a2c20');
      rect(sx - 26, fy + 1, 12, 1, '#3a2c20'); rect(sx + 12, fy + 1, 14, 1, '#3a2c20'); rect(sx - 8, fy + 1, 16, 1, '#2e231a');
    }
  }

  // The tower's face, painted over the wall around its window: two eyes, with the lit window as its nose/mouth.
  function drawFace(o) {
    const e = tower.eye, open = tower.hitFlash > 0 ? 1 : e.open * (e.blink > 0 ? 0 : 1);
    const dark = 1 - e.open;
    if (dark > 0.02) { ctx.globalAlpha = Math.min(1, dark * 0.9); rect(o.x + 27, o.y + 34, 10, 13, '#2c2a3a'); ctx.globalAlpha = 1; }   // window dims when asleep
    if (e.mouth > 0.05) {                                                                                             // yawn
      rect(o.x + 26, o.y + 38, 12, 9 + Math.round(e.mouth * 6), '#1a1420');
      rect(o.x + 28, o.y + 44 + Math.round(e.mouth * 6), 8, 2, '#a04858');
    }
    for (const ex of [19, 40]) {
      const h = Math.round(5 * open);
      if (h <= 0) { rect(o.x + ex, o.y + 40, 5, 1, '#1a1420'); continue; }
      const top = 37 + Math.round((5 - h) / 2);
      rect(o.x + ex, top + o.y, 5, h, '#f4ecd0');
      if (h >= 2) rect(o.x + ex + 1 + Math.round(e.look * 1.5), o.y + top + Math.floor((h - 2) / 2), 2, 2, '#1a1420');
    }
  }

  // One root-leg comes up to scratch the tower's nose (cutscene only).
  function drawScratchArm(o) {
    const px = o.x + 54, py = o.y + 50, s = easeIO(tower.scratch);
    const nx = o.x + 34 + Math.sin(tower.scratchWob) * 2.2 * s, ny = o.y + 47;
    const rest = 0, aim = Math.atan2(ny - py, nx - px) - Math.PI / 2 + Math.PI * 2;
    const r = rest + (aim - Math.PI * 2 - rest) * s;
    ctx.save(); ctx.translate(snap(px), snap(py)); ctx.rotate(r);
    if (sprites.leg) ctx.drawImage(sprites.leg, -9, 0); else { ctx.fillStyle = '#4a3a2a'; ctx.fillRect(-4, 0, 8, 28); }
    ctx.restore();
  }

  function drawOrbs(front) {
    if (!weapons[5].on) return;
    for (let i = 0; i < orbCount(); i++) {
      const o = orbPos(i);
      if (o.front !== front) continue;
      if (sprites.p_orb) drawSprite(sprites.p_orb, o.x, o.y, 0.5, 0.5); else rect(o.x - 3, o.y - 3, 6, 6, '#b070ff');
    }
  }

  // A ring of little squares (shock waves, landing markers)
  function ringDots(x, y, r, color, alpha, n) {
    ctx.globalAlpha = alpha;
    for (let k = 0; k < n; k++) { const a = k / n * 6.2832; rect(x + Math.cos(a) * r - 1, y + Math.sin(a) * r * 0.8 - 1, 2, 2, color); }
    ctx.globalAlpha = 1;
  }

  function boltLine(ax, ay, bx, by) {
    const n = Math.max(1, Math.ceil(Math.hypot(bx - ax, by - ay) / 1.5));
    for (let i = 0; i <= n; i++) { const t = i / n, x = ax + (bx - ax) * t, y = ay + (by - ay) * t; rect(x - 1, y - 1, 2, 2, '#6fe8ff'); }
    for (let i = 0; i <= n; i++) { const t = i / n, x = ax + (bx - ax) * t, y = ay + (by - ay) * t; rect(x - 0.5, y - 0.5, 1, 1, '#ffffff'); }
  }

  // Wind: a slow swell with a faster ripple on top, offset along x so gusts travel across the map.
  const windAt = x => { const t = performance.now() / 1000; return Math.sin(t * 1.1 + x * 0.02) * 0.65 + Math.sin(t * 2.4 + x * 0.05) * 0.25; };

  // Draw a sprite in horizontal bands, each shifted by a whole pixel, so the top sways more than the base and the
  // pixels stay crisp. sway is the offset of the very top, in world pixels.
  function drawSway(img, x, y, sway) {
    const w = img.width, h = img.height, bands = Math.max(2, Math.min(7, Math.round(h / 6)));
    const left = snap(x - w / 2), top = snap(y - h);
    for (let i = 0; i < bands; i++) {
      const sy = Math.floor(i * h / bands), ey = Math.floor((i + 1) * h / bands), k = 1 - (i + 0.5) / bands;
      ctx.drawImage(img, 0, sy, w, ey - sy, left + Math.round(sway * k * k), top + sy, w, ey - sy);
    }
  }

  function drawNode(n) {
    const T = NODE_TYPES[n.type];
    const jig = n.shake > 0 ? (Math.random() < 0.5 ? -1 : 1) * 0.5 : 0;
    const x = n.x + jig, y = n.y, sprKey = n.spr || T.spr, img = sprites[sprKey];
    const dying = n.dying > 0, u = dying ? n.dying / 0.25 : 1;
    if (img) {
      shadow(x - 6, y - 1, 12, 2);
      const im = n.flash > 0 && flashes[sprKey] ? flashes[sprKey] : img;
      if (dying) {                                     // squash down and fade
        ctx.save(); ctx.globalAlpha = u;
        ctx.translate(snap(x), snap(y)); ctx.scale(1 + (1 - u) * 0.35, 0.25 + 0.75 * u);
        ctx.drawImage(im, -Math.round(im.width / 2), -im.height);
        ctx.restore();
      } else if (T.sway) {
        const hit = n.shake > 0 ? (Math.random() < 0.5 ? -1 : 1) * 1.2 : 0;
        drawSway(im, x, y, windAt(n.x) * T.sway + hit);
      } else drawSprite(im, x, y, 0.5, 1);
    } else {                                           // placeholders if the art is missing
      const lit = n.flash > 0;
      shadow(x - 5, y - 1, 10, 2);
      if (n.type === 'tree') {
        rect(x - 1, y - 5, 3, 5, lit ? '#d9b080' : '#5a3a22');
        rect(x - 6, y - 11, 13, 6, lit ? '#cfe8a0' : '#2f5a2c'); rect(x - 5, y - 14, 11, 4, lit ? '#e8f8c0' : '#3f7a3a'); rect(x - 3, y - 16, 7, 3, lit ? '#e8f8c0' : '#3f7a3a');
      } else {
        rect(x - 5, y - 4, 10, 4, lit ? '#ffffff' : '#6a707c'); rect(x - 4, y - 6, 7, 2, lit ? '#ffffff' : '#808794');
        if (n.type !== 'rock') rect(x - 2, y - 5, 3, 2, T.chip);
      }
    }
    if (!dying && n.hp < n.maxHp) {                    // damage pips
      for (let i = 0; i < n.maxHp; i++) rect(n.x - n.maxHp + i * 2, n.y + 2, 1, 1, i < n.hp ? '#f2e6b0' : '#3a3a48');
    }
  }

  function drawMage() {
    const moving = Math.hypot(mage.vx, mage.vy) > 3;
    const bob = moving ? Math.abs(Math.sin(mage.step * 6.28)) * 0.75 : 0;
    const x = mage.x, y = mage.y - (mage.z || 0);
    const f = mage.flip ? -1 : 1;
    if (phase === 'bed' && bed.t >= 0) {                       // asleep on the ground at the foot of the tower
      const br = Math.sin(performance.now() / 600) > 0 ? 0 : 1;
      shadow(x - 8, y - 1, 16, 2);
      if (sprites.smith) {
        ctx.save(); ctx.translate(snap(x), snap(y - 5)); ctx.rotate(Math.PI / 2);
        ctx.drawImage(sprites.smith, -Math.round(sprites.smith.width / 2), -Math.round(sprites.smith.height / 2) - br);
        ctx.restore();
      } else {
        rect(x - 3, y - 6, 8, 5, '#7a4a34'); rect(x - 7, y - 7, 4, 4, '#e0b088'); rect(x - 8, y - 5 - br, 3, 2, '#6a3a22');
      }
      return;
    }
    shadow(x - 3, mage.y - 1, 6, 1);
    if (sprites.smith) {
      const img = sprites.smith, fw = Math.round(img.width / 3), fr = moving ? (Math.sin(mage.step * 6.28) > 0 ? 1 : 2) : 0, top = snap(y - img.height - bob * 0.5);
      if (!mage.flip) ctx.drawImage(img, fr * fw, 0, fw, img.height, snap(x - fw / 2), top, fw, img.height);
      else { ctx.save(); ctx.translate(snap(x), 0); ctx.scale(-1, 1); ctx.drawImage(img, fr * fw, 0, fw, img.height, Math.round(-fw / 2), top, fw, img.height); ctx.restore(); }
    } else {
      // placeholder blacksmith: bald head, big beard, rust shirt, leather apron, boots
      rect(x - 3, y - 8 - bob, 6, 6, '#7a4a34');                    // shirt
      rect(x - 2, y - 7 - bob, 4, 5, '#3a2a24');                    // apron
      rect(x - 3, y - 4 - bob, 6, 1, '#1a1418');                    // belt
      rect(x - 2, y - 12 - bob, 4, 4, '#e0b088');                   // head
      rect(x - 2, y - 9 - bob, 4, 2, '#6a3a22');                    // beard
      rect(x - 2, y - 13 - bob, 4, 1, '#c8c0b0');                   // sweatband
      rect(x + (f > 0 ? 0 : -1), y - 11 - bob, 1, 1, '#1a1b2a');    // eye, on the side he's facing
      rect(x - 3, y - 2, 2, 2, '#2a2430'); rect(x + 1, y - 2, 2, 2, '#2a2430');   // boots
    }
    // the hammer/pick points at the mouse; on a swing it chops forward through an arc
    const swingT = mage.swing > 0 ? mage.swing / 0.18 : 0;
    const a = (mage.swing > 0 ? mage.swingDir : mage.aim) + (mage.swing > 0 ? (swingT - 0.5) * 1.8 * f : 0);
    const hx = x + 3 * f, hy = sprites.smith ? y - 12 : y - 6 - bob;
    for (let i = 0; i < 5; i++) rect(hx + Math.cos(a) * i, hy + Math.sin(a) * i, 1, 1, '#8a5a32');
    rect(hx + Math.cos(a) * 5 - 1, hy + Math.sin(a) * 5 - 1, 3, 2, '#aab0c0');   // hammer head
  }

  function render() {
    const Z = zoom;
    const hw = VIEW_W / 2 / Z, hh = VIEW_H / 2 / Z;
    const ox = (Math.random() - 0.5) * shake * 2, oy = (Math.random() - 0.5) * shake * 2;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.fillStyle = '#0b0d17'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);

    camTx = Math.round(VIEW_W / 2 - camX * Z + ox); camTy = Math.round(VIEW_H / 2 - camY * Z + oy);
    ctx.setTransform(Z, 0, 0, Z, camTx, camTy);
    const onScreen = (x, y, m) => x > camX - hw - m && x < camX + hw + m && y > camY - hh - m && y < camY + hh + m;

    drawGround(hw, hh);
    drawGrassTile(hw, hh);
    drawGrass(hw, hh);

    // XP pickups (blue gems with a little bob)
    for (const d of xpDrops) {
      if (!onScreen(d.x, d.y, 8)) continue;
      const b = Math.sin(d.bob) > 0 ? 0 : 1;
      rect(d.x - 2, d.y + 3, XP_SIZE, 1, '#0a1a2e'); // shadow
      if (sprites.xp) {
        drawSprite(sprites.xp, d.x, d.y + 3 - b, 0.5, 1);
      } else {
        rect(d.x - 2, d.y - 2 - b + 1, XP_SIZE, XP_SIZE, '#3fb6ff');
        rect(d.x - 1, d.y - 2 - b + 1, 1, 1, '#d8f3ff');
      }
    }

    // Loot popping out of broken nodes
    for (const l of loot) {
      if (!onScreen(l.x, l.y, 12)) continue;
      const bobY = l.landed ? Math.sin(l.age * 7) * 0.6 : 0, ic = sprites['ic_' + l.type];
      shadow(l.x - 3, l.y + 1, 6, 1);
      if (ic) drawSprite(ic, l.x, l.y - l.z + bobY, 0.5, 1); else rect(l.x - 2, l.y - l.z - 4 + bobY, 4, 4, RES_COLOR[l.type]);
    }

    // Everything that stands up is drawn back-to-front by where its feet are
    const list = [];
    for (const n of nodes) if (onScreen(n.x, n.y, 24)) list.push([n.y, 0, n]);
    for (const z of zombies) if (onScreen(z.x, z.y, 12)) list.push([z.y + ZOMBIE_SIZE / 2, 1, z]);
    list.push([towerBaseY(), 2, tower]);
    if (phase !== 'night' && !(phase === 'bed' && bed.t >= 0)) list.push([mage.y, 3, mage]);
    list.sort((a, b) => a[0] - b[0]);
    for (const [, kind, o] of list) {
      if (kind === 0) drawNode(o); else if (kind === 1) drawZombie(o); else if (kind === 2) drawTower(); else drawMage();
    }

    // The tree or rock under the cursor gets corner brackets so you can see what a click will hit
    if (phase === 'day' && !menu) {
      const t = pickTarget();
      if (t) {
        const ti = sprites[t.spr || NODE_TYPES[t.type].spr], h = ti ? ti.height : NODE_TYPES[t.type].h, w = (ti ? ti.width : 12) + 2, bx = t.x - w / 2, by = t.y - h;
        for (const [cx, cy, dx, dy] of [[bx, by, 1, 1], [bx + w, by, -1, 1], [bx, by + h, 1, -1], [bx + w, by + h, -1, -1]]) {
          rect(Math.min(cx, cx + 3 * dx), cy, 3, 1, '#ffe9a0'); rect(cx - (dx > 0 ? 0 : 1), Math.min(cy, cy + 3 * dy), 1, 3, '#ffe9a0');
        }
      }
    }

    // Projectiles
    for (const sh of shots) {
      if (sh.kind === 'rock') {   // landing marker, ground shadow, and the boulder up on its arc
        ringDots(sh.tx, sh.ty, 22 + (Math.sin(performance.now() / 90) > 0 ? 1 : 0), '#ffd080', 0.6, 16);
        const sc = 1 - sh.h / 140;
        shadow(sh.x - 4 * sc, sh.y, 8 * sc, 2);
        if (sprites.p_rock) drawSprite(sprites.p_rock, sh.x, sh.y - sh.h, 0.5, 0.5); else rect(sh.x - 4, sh.y - sh.h - 4, 8, 8, '#8a8a96');
        continue;
      }
      const im = sh.kind === 'fire' ? sprites.p_fire : sh.kind === 'shard' ? sprites.p_shard : sprites.arrow;   // all authored pointing right
      if (im) {
        ctx.save();
        ctx.translate(snap(sh.x), snap(sh.y)); ctx.rotate(sh.a);
        ctx.drawImage(im, -Math.round(im.width / 2), -Math.round(im.height / 2));
        ctx.restore();
      } else {
        const dx = Math.cos(sh.a), dy = Math.sin(sh.a);
        for (let i = 0; i < 4; i++) rect(sh.x - dx * i * 2, sh.y - dy * i * 2, 2, 2, i === 0 ? '#ffffff' : '#c9b27a');
      }
    }

    // Lightning and shock rings
    for (const zp of zaps) {
      ctx.globalAlpha = Math.min(1, zp.life / zp.max * 1.6);
      for (const seg of zp.path) for (let i = 0; i < seg.length - 1; i++) boltLine(seg[i][0], seg[i][1], seg[i + 1][0], seg[i + 1][1]);
      for (const h of zp.hits) {
        if (sprites.p_bolt) drawSprite(sprites.p_bolt, h[0], h[1] + 2, 0.5, 1);
        rect(h[0] - 5, h[1] - 1, 10, 3, '#bff6ff');
      }
      ctx.globalAlpha = 1;
    }
    for (const rg of rings) ringDots(rg.x, rg.y, rg.max * (1 - rg.t / rg.life), rg.color, rg.t / rg.life, 22);

    // Particles (smaller in world units when zoomed in, so they stay chunky-but-small on screen)
    const ps = Z >= 2 ? 1 : 2;
    for (const p of particles) {
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      rect(p.x, p.y, ps, ps, p.color);
    }
    ctx.globalAlpha = 1;

    // ---- screen space from here ----
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    const toScreen = (x, y) => [x * Z + camTx, y * Z + camTy];

    // Lighting: night vignette fades into warm morning light
    if (dayLight < 0.999) {
      const g = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, 90, VIEW_W / 2, VIEW_H / 2, 270);
      g.addColorStop(0, 'rgba(5,6,20,0)'); g.addColorStop(1, 'rgba(5,6,20,0.55)');
      ctx.globalAlpha = 1 - dayLight; ctx.fillStyle = g; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
    if (dayLight > 0.001) {
      // the ground art is night-toned, so lift it toward warm morning colour without greying it out
      ctx.globalCompositeOperation = 'soft-light';
      ctx.globalAlpha = dayLight * 0.4; ctx.fillStyle = '#ffd890'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      ctx.globalCompositeOperation = 'screen';
      ctx.globalAlpha = dayLight * 0.18; ctx.fillStyle = '#3a3018'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      ctx.globalCompositeOperation = 'source-over';
    }
    ctx.globalAlpha = 1;

    // Floating "+2 WOOD" text
    ctx.font = '8px monospace'; ctx.textBaseline = 'top'; ctx.textAlign = 'center';
    for (const f of floaters) {
      const [sx, sy] = toScreen(f.x, f.y);
      ctx.globalAlpha = Math.min(1, f.life * 2);
      ctx.fillStyle = '#000'; ctx.fillText(f.text, Math.round(sx) + 1, Math.round(sy) + 1);
      ctx.fillStyle = f.color; ctx.fillText(f.text, Math.round(sx), Math.round(sy));
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';

    // By day: a pointer at the screen edge toward the nearest XP that's off screen
    if (phase === 'day' && xpDrops.length) {
      let best = null, bd = Infinity;
      for (const d of xpDrops) { const dd = dist2(d.x, d.y, mage.x, mage.y); if (dd < bd) { bd = dd; best = d; } }
      const [sx, sy] = toScreen(best.x, best.y);
      if (sx < 0 || sx > VIEW_W || sy < 0 || sy > VIEW_H) {
        const px = Math.max(10, Math.min(VIEW_W - 10, sx)), py = Math.max(44, Math.min(VIEW_H - 20, sy));
        const pulse = Math.sin(performance.now() / 150) > 0 ? 1 : 0;
        ctx.fillStyle = '#3fb6ff';
        ctx.fillRect(px - 2 - pulse, py - 2 - pulse, 4 + pulse * 2, 4 + pulse * 2);
        ctx.fillStyle = '#d8f3ff'; ctx.fillRect(px - 1, py - 1, 1, 1);
      }
    }

    // HUD
    ctx.font = '8px monospace'; ctx.textBaseline = 'top';
    const label = (t, x, y, c) => { ctx.fillStyle = '#000'; ctx.fillText(t, x + 1, y + 1); ctx.fillStyle = c; ctx.fillText(t, x, y); };

    // resources, always visible
    const row = [['wood', res.wood], ['stone', res.stone], ['copper', res.copper], ['iron', res.iron], ['crystal', res.crystal], ['xp', res.xp]];
    let rx = 8;
    for (const [k, v] of row) {
      const bump = Math.max(0, hudBump[k] || 0), iy = VIEW_H - 27 - Math.round(Math.sin(bump / 0.3 * Math.PI) * 5);
      const ic = k === 'xp' ? sprites.xp : sprites['ic_' + k];
      if (ic) ctx.drawImage(ic, rx, iy + (k === 'xp' ? 2 : 0)); else { ctx.fillStyle = RES_COLOR[k]; ctx.fillRect(rx + 2, iy + 2, 6, 6); }
      const t = String(v); label(t, rx + 12, VIEW_H - 24, bump > 0 ? '#ffffff' : '#e8e8f0');
      rx += 12 + ctx.measureText(t).width + 8;
    }

    if (phase === 'night') {
      ctx.fillStyle = '#000'; ctx.fillRect(8, 8, 62, 6); ctx.fillStyle = '#d94a4a'; ctx.fillRect(9, 9, Math.round(60 * tower.hp / tower.maxHp), 4);
      label('NIGHT ' + nightNo + '   KILLS ' + kills, 8, 18, '#cfd6ff');
      label('XP ON GROUND ' + xpDrops.length, 8, 28, '#3fb6ff');
      const left = Math.max(0, Math.ceil(NIGHT_LENGTH - time));
      label('DAWN IN ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'), VIEW_W - 62, 8, '#8a90b0');
      label('WASD steer tower   1-6 weapons on/off   N skip to dawn   R restart', 8, VIEW_H - 12, '#8a90b0');
      // weapon bar: one cell per mount, dimmed when switched off, with a cooldown bar
      const cw = 26, x0 = Math.round(VIEW_W / 2 - cw * 3), y0 = VIEW_H - 54;
      weapons.forEach((w, i) => {
        const x = x0 + i * cw;
        ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(x, y0 - 2, cw - 2, 26);
        ctx.globalAlpha = !w.owned ? 0.1 : w.on ? 1 : 0.28;
        const img = sprites[w.spr];
        if (img) ctx.drawImage(img, x + 1, y0 - 1); else { ctx.fillStyle = w.color; ctx.fillRect(x + 6, y0 + 4, 10, 10); }
        ctx.globalAlpha = 1;
        const cd = w.interval > 0 ? 1 - Math.max(0, w.timer) / wInterval(w) : 1;
        ctx.fillStyle = '#000'; ctx.fillRect(x, y0 + 20, cw - 2, 3);
        if (w.on) { ctx.fillStyle = w.color; ctx.fillRect(x + 1, y0 + 21, Math.round((cw - 4) * Math.min(1, cd)), 1); }
        label(String(i + 1), x + 2, y0 - 2, w.on ? '#ffffff' : '#6a708a');
      });
    } else if (phase === 'day') {
      label('DAY ' + nightNo + '   ' + Math.round(Math.hypot(tower.x, tower.y) / 10) + 'm FROM START', 8, 8, '#ffe9a0');
      const frac = Math.max(0, dayTime / DAY_LENGTH);
      ctx.fillStyle = '#000'; ctx.fillRect(8, 18, 62, 6); ctx.fillStyle = frac < 0.2 ? '#ff9a5a' : '#ffcf5a'; ctx.fillRect(9, 19, Math.round(60 * frac), 4);
      label('XP ON GROUND ' + xpDrops.length, 8, 28, '#3fb6ff');
      label(dusk && toWorkshop ? 'NIGHTFALL: HEADING TO THE TOWER...' : dusk ? 'LAST CHANCE TO UPGRADE: THEN SLEEP' : 'WASD walk  MOUSE aim  CLICK chop/mine  E / click tower: workshop  N sleep', 8, VIEW_H - 12, '#c8b890');
      if (!menu && nearTower()) {
        const [tx, ty] = toScreen(tower.x, tower.y - TOWER_H - 30);
        ctx.textAlign = 'center'; label('E: WORKSHOP', Math.round(tx), Math.round(Math.max(30, ty)), '#ffe9a0'); ctx.textAlign = 'left';
      }
    } else {
      label(phase === 'bed' ? 'SPACE to skip' : '', VIEW_W - 76, VIEW_H - 12, '#8a90b0');
    }
    if (menu && phase === 'day') drawMenu(label);
    drawBanner(label);
    if (phase === 'bed') drawBedOverlay(label);

    // our own cursor (the system one is hidden): crosshair in the field, arrow over the workshop
    if (phase === 'day' || gameOver) {
      const cx = Math.round(mouse.sx), cy = Math.round(mouse.sy);
      if (menu) {
        ctx.fillStyle = '#000'; ctx.fillRect(cx - 1, cy - 1, 3, 9); ctx.fillRect(cx - 1, cy - 1, 7, 3);
        ctx.fillStyle = '#fff'; ctx.fillRect(cx, cy, 1, 7); ctx.fillRect(cx, cy, 5, 1);
      } else {
        const g = 3, l = 4;
        ctx.fillStyle = '#000';
        ctx.fillRect(cx - g - l - 1, cy - 1, l + 2, 3); ctx.fillRect(cx + g, cy - 1, l + 2, 3);
        ctx.fillRect(cx - 1, cy - g - l - 1, 3, l + 2); ctx.fillRect(cx - 1, cy + g, 3, l + 2);
        ctx.fillStyle = '#fff';
        ctx.fillRect(cx - g - l, cy, l, 1); ctx.fillRect(cx + g + 1, cy, l, 1);
        ctx.fillRect(cx, cy - g - l, 1, l); ctx.fillRect(cx, cy + g + 1, 1, l);
        ctx.fillStyle = '#ffcf5a'; ctx.fillRect(cx, cy, 1, 1);
      }
    }

    if (gameOver) {
      const m = Math.floor(time / 60), s = Math.floor(time % 60);
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
      ctx.fillStyle = '#fff'; ctx.font = '16px monospace'; ctx.textAlign = 'center';
      ctx.fillText('THE TOWER FALLS', VIEW_W / 2, VIEW_H / 2 - 20);
      ctx.font = '8px monospace';
      ctx.fillText('Night ' + nightNo + '   Kills ' + kills + '   Survived ' + m + ':' + String(s).padStart(2, '0'), VIEW_W / 2, VIEW_H / 2 + 2);
      ctx.fillText('Press R to restart', VIEW_W / 2, VIEW_H / 2 + 16);
      ctx.textAlign = 'left';
    }
  }

  // ---------- Loop ----------
  reset();
  // test hook: lets an automated check read game state; harmless for players
  window.__duolith = { get: () => ({ up, menu, dayTime, bed, dawnT, weapons, shots: shots.length, phase, zoom, res, xp: xpDrops.length, nodes: nodes.length, nodeList: nodes, xpList: xpDrops, mage, tower, zombies: zombies.length, gameOver, camTx, camTy }),
                       setXpDrops: a => { xpDrops = a; }, menuItems, openWorkshop, hitNode, getLoot: () => loot.length };
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
